const LS={U:"cv_users_v4",ME:"cv_me_v4",N:"cv_notifs_v4",P:"cv_prices_v4",AR:"cv_adminreq_v4"};
const lsGet=(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d;}catch{return d;}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v));}catch{}};

const SEED_USERS=[{id:"super",email:SUPER_EMAIL,password:SUPER_PASS,name:"Nosson",phone:"",role:"super",adminApproved:true,recovery:"",recoveryType:"email",createdAt:"Jan 2024",settings:{...DS},cards:[],folders:[],wishlist:[]}];
function initUsers(){const u=lsGet(LS.U,null);if(u&&u.length){if(!u.find(x=>x.role==="super")){return[...SEED_USERS,...u];}return u;}return SEED_USERS;}
function saveUsers(u){lsSet(LS.U,u);}
function initMe(users){const d=lsGet(LS.ME,null);if(d)return users.find(u=>u.id===d.id)||null;return null;}
function saveMe(u){if(u)lsSet(LS.ME,{id:u.id});else localStorage.removeItem(LS.ME);}
function initNotifs(){return lsGet(LS.N,[]);}
function saveNotifs(n){lsSet(LS.N,n);}
function initPrices(){return lsGet(LS.P,{});}
function savePrices(p){lsSet(LS.P,p);}
function initAdminReqs(){return lsGet(LS.AR,[]);}
function saveAdminReqs(r){lsSet(LS.AR,r);}

/* Card price key — player+year+brand+type+parallel */
function priceKey(card){return[card.player,card.year,card.brand,card.type,card.parallel||"Base"].filter(Boolean).join("|").toLowerCase();}

function Btn({children,onClick,v="fill",sz="md",t,sx={},disabled}){
  const sizes={sm:{padding:"7px 16px",fontSize:12,borderRadius:10},md:{padding:"11px 22px",fontSize:14,borderRadius:12},lg:{padding:"14px 28px",fontSize:15,borderRadius:13},full:{padding:"14px",fontSize:15,borderRadius:13,width:"100%"}};
  const vars={
    fill:{background:t.gradBtn,color:"#fff",border:"none",boxShadow:"0 4px 16px rgba(108,61,251,0.4)"},
    soft:{background:t.accBg,color:t.acc,border:"none"},
    ghost:{background:"transparent",color:t.tx2,border:"1.5px solid "+t.bord},
    gold:{background:t.gradGold,color:"#fff",border:"none",boxShadow:"0 4px 16px rgba(245,158,11,0.35)"},
    grn:{background:t.gradGrn,color:"#fff",border:"none",boxShadow:"0 4px 16px rgba(16,185,129,0.35)"},
    red:{background:t.red,color:"#fff",border:"none"},
    dark:{background:t.surf3,color:t.tx2,border:"1.5px solid "+t.bord},
  };
  return <button onClick={disabled?undefined:onClick} style={{...sizes[sz],...vars[v],fontWeight:700,cursor:disabled?"not-allowed":"pointer",opacity:disabled?.5:1,fontFamily:"inherit",transition:"all .15s",...sx}}>{children}</button>;
}

function Card({children,t,sx={},onClick,glow}){

  return <div onClick={onClick} onMouseEnter={()=>setHov(true)} onMouseLeave={()=>setHov(false)} style={{background:t.surf,border:"1px solid "+t.bord,borderRadius:18,boxShadow:glow||(hov&&onClick)?t.shHov:t.sh,transition:"all .2s",...sx,cursor:onClick?"pointer":"default"}}>{children}</div>;
}

function Sw({on,toggle,t}){return <div onClick={toggle} style={{width:50,height:28,borderRadius:14,background:on?t.acc:t.bord,cursor:"pointer",position:"relative",transition:"all .25s",flexShrink:0}}><div style={{width:24,height:24,borderRadius:12,background:"#fff",position:"absolute",top:2,left:on?24:2,transition:"left .25s",boxShadow:"0 2px 8px rgba(0,0,0,.25)"}}/></div>;}

function Inp({label,value,onChange,type="text",placeholder,t,sx={},disabled,onEnter}){
  return(
    <div style={sx}>
      {label&&<div style={{fontSize:11,fontWeight:700,color:t.tx3,marginBottom:5,letterSpacing:.5}}>{label.toUpperCase()}</div>}
      <input type={type} value={value||""} onChange={e=>onChange(e.target.value)} placeholder={placeholder} disabled={disabled}
        onKeyDown={e=>{if(e.key==="Enter"&&onEnter)onEnter();}}
        style={{width:"100%",padding:"11px 14px",borderRadius:11,border:"1.5px solid "+t.bord,background:t.inp,color:t.tx,fontSize:14,outline:"none",boxSizing:"border-box",fontFamily:"inherit",transition:"border .15s",opacity:disabled?.6:1}}

}

function CardArt({card,sm}){
  const isP=card.parallel&&card.parallel!=="Base";
  const bg=isP&&PSHIM[card.parallel]?PSHIM[card.parallel]:`linear-gradient(150deg,${card.color||"#6C3DFB"}dd,${card.color||"#6C3DFB"}77)`;
  return(
    <div style={{width:"100%",height:"100%",background:bg,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",position:"relative",overflow:"hidden",borderRadius:"inherit"}}>
      {isP&&<div style={{position:"absolute",inset:0,background:"linear-gradient(45deg,transparent 35%,rgba(255,255,255,.28) 50%,transparent 65%)",backgroundSize:"200% 200%",animation:"shim 2.5s linear infinite"}}/>}
      <div style={{position:"absolute",inset:0,opacity:.07,background:"repeating-linear-gradient(45deg,#fff 0,#fff 1px,transparent 1px,transparent 8px)"}}/>
      {card.graded&&!sm&&<div style={{position:"absolute",top:6,left:6,background:"linear-gradient(135deg,#F59E0B,#EF4444)",borderRadius:5,padding:"2px 6px",color:"#fff",fontSize:9,fontWeight:800,letterSpacing:.5}}>{card.grade}</div>}
      {card.serialed&&!sm&&<div style={{position:"absolute",top:6,right:6,background:"rgba(0,0,0,.7)",borderRadius:4,padding:"1px 5px",color:"#FBBF24",fontSize:8,fontFamily:"monospace"}}>{card.serialNum}</div>}
      <div style={{fontSize:sm?18:30,marginBottom:sm?2:6}}>{SI[card.sport]||"🃏"}</div>
      {!sm&&<div style={{color:"rgba(255,255,255,.7)",fontSize:10,fontWeight:500,marginBottom:2,textAlign:"center"}}>{card.year}{card.brand?" · "+card.brand:""}</div>}
      <div style={{color:"#fff",fontSize:sm?11:15,fontWeight:800,textAlign:"center",lineHeight:1.2,padding:sm?"0 4px":"0 8px",textShadow:"0 1px 4px rgba(0,0,0,.4)"}}>{card.player}</div>
      {!sm&&<div style={{color:"#FBBF24",fontSize:10,fontWeight:700,marginTop:4}}>{card.type}{isP?" · "+card.parallel:""}</div>}
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════

function CardTile({card,onClick,selMode,selSet,selIds,t}){
  const[hov,setHov]=useState(false);
  const isSel=selIds?.has(card.id);
  const isP=card.parallel&&card.parallel!=="Base";
  return(
    <div onClick={()=>selMode?selSet(s=>{const n=new Set(s);n.has(card.id)?n.delete(card.id):n.add(card.id);return n;}):onClick&&onClick(card)}
      onMouseEnter={()=>setHov(true)} onMouseLeave={()=>setHov(false)}
      style={{cursor:"pointer",borderRadius:16,overflow:"hidden",aspectRatio:"2.5/3.5",position:"relative",
        transform:hov&&!selMode?"translateY(-6px) scale(1.03)":"none",transition:"all .2s cubic-bezier(.34,1.56,.64,1)",
        boxShadow:isSel?"0 0 0 3px "+t.acc+","+t.shHov:hov?t.shHov:t.sh}}>
      {card.image?<img src={card.image} alt={card.player} style={{width:"100%",height:"100%",objectFit:"cover"}}/>:<CardArt card={card}/>}
      {isP&&<div style={{position:"absolute",top:0,left:0,right:0,height:3,background:PSHIM[card.parallel]||t.gold}}/>}
      <div style={{position:"absolute",bottom:0,left:0,right:0,padding:"20px 9px 8px",background:"linear-gradient(transparent,rgba(0,0,0,.9))"}}>
        <div style={{color:"#fff",fontSize:11,fontWeight:700,whiteSpace:"nowrap",overflow:"hidden",textOverflow:"ellipsis"}}>{card.player}</div>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginTop:1}}>
          <div style={{color:card.graded?"#34D399":card.type==="Rookie"?"#FBBF24":"rgba(255,255,255,.5)",fontSize:9,fontWeight:600}}>{card.graded?card.grade:(card.condition||"").replace("Raw - "," ")}</div>
          {card.ebayAvg&&<div style={{color:"#FBBF24",fontSize:9,fontWeight:800}}>{fmt(card.ebayAvg)}</div>}
        </div>
      </div>
      {selMode&&<div style={{position:"absolute",top:8,right:8,width:22,height:22,borderRadius:11,border:"2.5px solid "+t.acc,background:isSel?t.acc:"rgba(255,255,255,.9)",display:"flex",alignItems:"center",justifyContent:"center"}}>{isSel&&<span style={{color:"#fff",fontSize:13,fontWeight:900}}>✓</span>}</div>}
    </div>
  );
}

// Store the install prompt globally so any component can trigger it
let _installPrompt = null;

function InstallBanner({t}){
  const[show,setShow]=useState(false);
  const[dismissed,setDismissed]=useState(()=>!!localStorage.getItem("cv_install_dismissed"));
  useEffect(()=>{
    const h=e=>{e.preventDefault();_installPrompt=e;if(!dismissed)setShow(true);};
    window.addEventListener("beforeinstallprompt",h);
    window.addEventListener("appinstalled",()=>{setShow(false);_installPrompt=null;});
    return()=>window.removeEventListener("beforeinstallprompt",h);
  },[dismissed]);
  if(!show||dismissed)return null;
  const install=async()=>{
    if(!_installPrompt)return;
    _installPrompt.prompt();
    const{outcome}=await _installPrompt.userChoice;
    if(outcome==="accepted"){setShow(false);_installPrompt=null;}
  };
  const dismiss=()=>{setShow(false);setDismissed(true);localStorage.setItem("cv_install_dismissed","1");};
  return(
    <div style={{position:"fixed",bottom:90,left:16,right:16,zIndex:8000,background:t.gradBtn,borderRadius:18,padding:"16px 18px",display:"flex",gap:14,alignItems:"center",boxShadow:"0 8px 32px rgba(108,61,251,.45)",animation:"slideUp .4s ease"}}>
      <div style={{fontSize:32,flexShrink:0}}>📲</div>
      <div style={{flex:1}}>
        <div style={{color:"#fff",fontWeight:800,fontSize:15,marginBottom:2}}>Install Card Vault</div>
        <div style={{color:"rgba(255,255,255,.8)",fontSize:12}}>Add to your home screen</div>
      </div>
      <div style={{display:"flex",gap:8,flexShrink:0}}>

/* ═══════════════════════════════════════════════════════════
   BIOMETRIC HELPERS
═══════════════════════════════════════════════════════════ */
async function biometricAvailable(){
  if(!window.PublicKeyCredential)return false;
  try{return await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable();}
  catch{return false;}
}
async function biometricRegister(userId){
  try{
    const cred=await navigator.credentials.create({publicKey:{
      challenge:new Uint8Array(32),rp:{name:"Card Vault",id:location.hostname==="localhost"?"localhost":location.hostname},
      user:{id:new TextEncoder().encode(userId),name:userId,displayName:"Card Vault User"},
      pubKeyCredParams:[{alg:-7,type:"public-key"},{alg:-257,type:"public-key"}],
      authenticatorSelection:{userVerification:"required",authenticatorAttachment:"platform"},
      timeout:60000,attestation:"none"
    }});
    if(cred){lsSet("cv_biometric_id",userId);return true;}
  }catch(e){console.log("biometric register failed",e);}
  return false;
}
async function biometricAuth(){
  try{
    const cred=await navigator.credentials.get({publicKey:{
      challenge:new Uint8Array(32),rpId:location.hostname==="localhost"?"localhost":location.hostname,
      userVerification:"required",timeout:60000
    }});
    return !!cred;
  }catch{return false;}
}

/* ═══════════════════════════════════════════════════════════
   SCAN MODAL
═══════════════════════════════════════════════════════════ */
function ScanModal({onClose,onAdd,folders,t}){
  const[step,setStep]=useState("choose");
  const[frontPrev,setFrontPrev]=useState(null);
  const[backPrev,setBackPrev]=useState(null);
  const[frontBlob,setFrontBlob]=useState(null);
  const[backBlob,setBackBlob]=useState(null);
  const[result,setResult]=useState(null);
  const[form,setForm]=useState(null);
  const[camErr,setCamErr]=useState("");
  const fRef=useRef(),bRef=useRef(),errBRef=useRef(),vidRef=useRef(),canRef=useRef(),strRef=useRef(null);

  useEffect(()=>()=>{strRef.current?.getTracks().forEach(x=>x.stop());},[]);
  const stopCam=()=>{strRef.current?.getTracks().forEach(x=>x.stop());strRef.current=null;};

  const resizeImg=async file=>new Promise(res=>{
    const img=new Image(),url=URL.createObjectURL(file);
    img.onload=()=>{
      const MAX=1200;let w=img.naturalWidth,h=img.naturalHeight;
      if(w>MAX||h>MAX){if(w>h){h=Math.round(h*MAX/w);w=MAX;}else{w=Math.round(w*MAX/h);h=MAX;}}
      const c=document.createElement("canvas");c.width=w;c.height=h;
      c.getContext("2d").drawImage(img,0,0,w,h);URL.revokeObjectURL(url);
      c.toBlob(b=>res(b),"image/jpeg",.85);
    };img.onerror=()=>res(file);img.src=url;
  });

  const toB64=blob=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result.split(",")[1]);r.onerror=rej;r.readAsDataURL(blob);});

  const startCam=async()=>{
    setCamErr("");
    if(location.protocol==="file:"){setCamErr("Camera needs HTTPS. Use Photo Library instead!");return;}
    if(!navigator.mediaDevices?.getUserMedia){setCamErr("Camera not available. Use Photo Library.");return;}
    try{
      const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment",width:{ideal:1920}},audio:false});
      strRef.current=s;setStep("cam");
      setTimeout(()=>{if(vidRef.current){vidRef.current.srcObject=s;vidRef.current.play().catch(()=>{});}},120);
    }catch(e){setCamErr(e.name==="NotAllowedError"?"Camera permission denied — use Photo Library.":"Camera unavailable — use Photo Library.");}
  };

  const capture=()=>{
    const v=vidRef.current,c=canRef.current;if(!v||!c)return;
    c.width=v.videoWidth||1280;c.height=v.videoHeight||720;
    c.getContext("2d").drawImage(v,0,0);
    c.toBlob(blob=>{stopCam();const url=URL.createObjectURL(blob);setFrontPrev(url);setFrontBlob(blob);doAnalyze(blob,null);},"image/jpeg",.92);
  };

  const pickFront=async file=>{if(!file)return;const r=await resizeImg(file);setFrontPrev(URL.createObjectURL(r));setFrontBlob(r);};
  const pickBack =async file=>{if(!file)return;const r=await resizeImg(file);setBackPrev(URL.createObjectURL(r));setBackBlob(r);};

  const doAnalyze=async(fBlob,bBlob)=>{
    setStep("scan");
    try{
      const fB64=await toB64(fBlob);
      const content=[{type:"image",source:{type:"base64",media_type:"image/jpeg",data:fB64}}];
      if(bBlob){const bB64=await toB64(bBlob);content.push({type:"image",source:{type:"base64",media_type:"image/jpeg",data:bB64}});content.push({type:"text",text:"Image 1 is FRONT, Image 2 is BACK of a sports card. Use both for accuracy."});}
      content.push({type:"text",text:`Analyze this sports card. Return ONLY valid JSON:\n{"player":"full name","sport":"Football|Basketball|Baseball|Hockey|Soccer|Golf|Tennis|MMA|Other","year":"4-digit year","brand":"exact brand","type":"Rookie|Base|Prospect|Autograph|Patch Auto|Chrome|Prizm|Refractor|Parallel|Insert|Short Print|Relic|Jersey|Patch|Other","parallel":"Base|Silver|Gold|Blue|Red|Green|Pink|Orange|Purple|Black|Mojo|Hyper|Disco|Neon|Other","team":"team name","condition":"Raw - Mint|Raw - Near Mint|Raw - Excellent|Raw - Good|Raw - Fair","graded":false,"grade":"","serialed":false,"serialNum":"","notes":"serial, parallel info, print run","confidence":"high|medium|low"}\nIf not a sports card: {"error":"not a sports card"}`});
      const resp=await fetch("/api/analyze",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({content})});
      if(!resp.ok){const e=await resp.json().catch(()=>({}));throw new Error(e.error||"Server error "+resp.status);}
      const data=await resp.json();
      const raw=(data.content||[]).map(x=>x.text||"").join("").trim().replace(/^```[a-z]*\n?/,"").replace(/```$/,"").trim();
      if(!raw)throw new Error("Empty response");
      const parsed=JSON.parse(raw);
      if(parsed.error)throw new Error(parsed.error);
      setResult(parsed);
      const formData={player:parsed.player||"",sport:parsed.sport||"Football",year:parsed.year||"",brand:parsed.brand||"",type:parsed.type||"Base",parallel:parsed.parallel||"Base",team:parsed.team||"",condition:parsed.condition||"Raw - Near Mint",graded:!!parsed.graded,grade:parsed.grade||"",serialed:!!parsed.serialed,serialNum:parsed.serialNum||"",notes:parsed.notes||"",folder:null,ebayLow:null,ebayAvg:null};
      setForm(formData);
      // Auto-fetch eBay prices in background
      if(parsed.player&&parsed.year&&parsed.brand){
        fetch("/api/prices",{method:"POST",headers:{"Content-Type":"application/json"},
          body:JSON.stringify({player:parsed.player,year:parsed.year,brand:parsed.brand,type:parsed.type||"Base",parallel:parsed.parallel||"Base",serialNum:parsed.serialNum||"",grade:parsed.grade||"",graded:!!parsed.graded,condition:parsed.condition||""})
        }).then(r=>r.json()).then(p=>{
          if(p.found&&(p.avgPrice||p.lowPrice)){
            setForm(f=>({...f,ebayLow:p.lowPrice||null,ebayAvg:p.avgPrice||null,_priceNote:p.note||"",_salesCount:p.salesCount||0,_priceConf:p.confidence||""}));
          }
        }).catch(()=>{});
      }
    }catch(e){
      let msg=e.message||"Could not identify card.";
      if(msg.includes("Failed to fetch")||msg.includes("NetworkError")||msg.includes("Load failed"))msg="Could not reach server. Make sure you're using the Vercel URL.";
      setResult({_err:msg});
    }
    setStep("res");
  };

  const doAdd=async()=>{
    if(!form)return;
    // Convert blob URL to base64 so image persists after page reload
    let imgData=null;
    if(frontBlob){
      imgData=await new Promise(res=>{const r=new FileReader();r.onload=()=>res(r.result);r.readAsDataURL(frontBlob);});
    }else if(frontPrev&&frontPrev.startsWith("data:")){
      imgData=frontPrev;
    }
    // Include auto-fetched eBay prices if available
    onAdd({...form,id:uid(),image:imgData,color:rc(form.sport),ebayLow:form.ebayLow||null,ebayAvg:form.ebayAvg||null});
    onClose();
  };
  const reset=()=>{setStep("choose");setResult(null);setFrontPrev(null);setFrontBlob(null);setBackPrev(null);setBackBlob(null);setCamErr("");};

  const Sheet=({children,noClose})=>(
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.6)",zIndex:5000,display:"flex",alignItems:"flex-end",justifyContent:"center",backdropFilter:"blur(4px)"}} onClick={noClose?undefined:()=>{stopCam();onClose();}}>
      <div onClick={e=>e.stopPropagation()} style={{background:t.surf,borderRadius:"24px 24px 0 0",width:"100%",maxWidth:500,border:"1px solid "+t.bord,maxHeight:"93vh",overflowY:"auto",boxShadow:t.shHov}}>
        {children}
      </div>
    </div>
  );
  const Hdr=({title})=>(
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"20px 20px 4px"}}>
      <div style={{fontSize:18,fontWeight:900,color:t.tx,letterSpacing:-.3}}>{title}</div>
      <button onClick={()=>{stopCam();onClose();}} style={{background:t.surf3,border:"none",color:t.tx2,width:32,height:32,borderRadius:16,cursor:"pointer",fontSize:20,lineHeight:"32px",textAlign:"center"}}>×</button>
    </div>
  );

  if(step==="choose")return(
    <Sheet>
      <Hdr title="Add Card"/>
      {camErr&&<div style={{margin:"4px 20px 8px",color:t.red,fontSize:13,background:t.redBg,padding:"10px 14px",borderRadius:12,lineHeight:1.55}}>{camErr}</div>}
      <div style={{padding:"10px 20px 24px",display:"flex",flexDirection:"column",gap:14}}>
        <div>
          <div style={{fontSize:13,fontWeight:700,color:t.tx,marginBottom:8}}>📋 Front of Card <span style={{color:t.grn,fontWeight:500,fontSize:12}}>(required)</span></div>
          {frontPrev?(<div style={{display:"flex",gap:10,alignItems:"center",background:t.surf2,borderRadius:14,padding:10}}>
            <img src={frontPrev} alt="front" style={{width:56,height:78,objectFit:"cover",borderRadius:10,flexShrink:0}}/>
            <div style={{flex:1}}>
              <div style={{fontSize:13,fontWeight:700,color:t.grn,marginBottom:4}}>✓ Front photo ready</div>
              <button onClick={()=>{setFrontPrev(null);setFrontBlob(null);}} style={{background:"none",border:"none",color:t.acc,fontSize:13,cursor:"pointer",padding:0,fontWeight:600}}>Change</button>
            </div>
          </div>):(
            <div style={{display:"flex",gap:8}}>
              <button onClick={startCam} style={{flex:1,padding:"16px 8px",borderRadius:14,border:"1.5px solid "+t.bord,background:t.surf2,cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center",gap:6,transition:"all .15s"}} onMouseEnter={e=>e.currentTarget.style.borderColor=t.acc} onMouseLeave={e=>e.currentTarget.style.borderColor=t.bord}>
                <span style={{fontSize:28}}>📷</span><span style={{fontSize:12,fontWeight:700,color:t.tx}}>Camera</span>
              </button>
              <button onClick={()=>fRef.current?.click()} style={{flex:1,padding:"16px 8px",borderRadius:14,border:"1.5px solid "+t.bord,background:t.surf2,cursor:"pointer",display:"flex",flexDirection:"column",alignItems:"center",gap:6,transition:"all .15s"}} onMouseEnter={e=>e.currentTarget.style.borderColor=t.acc} onMouseLeave={e=>e.currentTarget.style.borderColor=t.bord}>
                <span style={{fontSize:28}}>🖼️</span><span style={{fontSize:12,fontWeight:700,color:t.tx}}>Photo Library</span><span style={{fontSize:10,color:t.tx3}}>JPG · PNG · HEIC</span>
              </button>
            </div>
          )}
        </div>
        <div>
          <div style={{fontSize:13,fontWeight:700,color:t.tx,marginBottom:8}}>🔄 Back of Card <span style={{color:t.tx3,fontWeight:400,fontSize:12}}>(optional — improves accuracy)</span></div>
          {backPrev?(<div style={{display:"flex",gap:10,alignItems:"center",background:t.surf2,borderRadius:14,padding:10}}>
            <img src={backPrev} alt="back" style={{width:56,height:78,objectFit:"cover",borderRadius:10,flexShrink:0}}/>
            <div style={{flex:1}}>
              <div style={{fontSize:13,fontWeight:700,color:t.grn,marginBottom:4}}>✓ Back photo ready</div>
              <button onClick={()=>{setBackPrev(null);setBackBlob(null);}} style={{background:"none",border:"none",color:t.acc,fontSize:13,cursor:"pointer",padding:0,fontWeight:600}}>Change</button>
            </div>
          </div>):(
            <button onClick={()=>bRef.current?.click()} style={{padding:"12px 16px",borderRadius:14,border:"1.5px dashed "+t.bord,background:"transparent",cursor:"pointer",display:"flex",alignItems:"center",gap:10,width:"100%",transition:"all .15s"}} onMouseEnter={e=>e.currentTarget.style.borderColor=t.acc} onMouseLeave={e=>e.currentTarget.style.borderColor=t.bord}>
              <span style={{fontSize:20,color:t.tx3}}>➕</span>
              <span style={{fontSize:13,color:t.tx2}}>Add back photo (serials, grading label)</span>
            </button>
          )}
        </div>
        <input ref={fRef} type="file" accept="image/*" style={{display:"none"}} onChange={e=>{const f=e.target.files?.[0];if(f)pickFront(f);e.target.value="";}}/>
        <input ref={bRef} type="file" accept="image/*" style={{display:"none"}} onChange={e=>{const f=e.target.files?.[0];if(f)pickBack(f);e.target.value="";}}/>
        {frontBlob&&<Btn t={t} v="fill" sz="full" onClick={()=>doAnalyze(frontBlob,backBlob)}>{backBlob?"🔍 Analyze Front + Back →":"🔍 Analyze Card →"}</Btn>}
        <div style={{color:t.tx3,fontSize:12,textAlign:"center",lineHeight:1.6}}>💡 Good lighting + flat surface = best results. Back photo helps with serials.</div>
      </div>
    </Sheet>
  );

  if(step==="cam")return(
    <Sheet noClose>
      <Hdr title="Photograph Front"/>
      <div style={{padding:"0 20px 20px"}}>
        <div style={{borderRadius:16,overflow:"hidden",background:"#000",position:"relative",aspectRatio:"3/4",marginBottom:14}}>
          <video ref={vidRef} autoPlay playsInline muted style={{width:"100%",height:"100%",objectFit:"cover",display:"block"}}/>
          <div style={{position:"absolute",inset:0,pointerEvents:"none",display:"flex",alignItems:"center",justifyContent:"center"}}>
            <div style={{width:"62%",aspectRatio:"2.5/3.5",border:"2.5px solid rgba(255,255,255,.9)",borderRadius:12,boxShadow:"0 0 0 2000px rgba(0,0,0,.45)",position:"relative"}}>
              <div style={{position:"absolute",top:-26,left:"50%",transform:"translateX(-50%)",color:"#fff",fontSize:11,fontWeight:600,background:"rgba(0,0,0,.6)",padding:"3px 10px",borderRadius:10,whiteSpace:"nowrap"}}>Fit card in frame</div>
            </div>
          </div>
        </div>
        <canvas ref={canRef} style={{display:"none"}}/>
        <div style={{display:"flex",gap:10}}>
          <Btn t={t} v="ghost" onClick={()=>{stopCam();setStep("choose");}} sx={{flex:1}}>Back</Btn>
          <Btn t={t} v="fill" sz="lg" onClick={capture} sx={{flex:2}}>📸 Capture</Btn>
        </div>
      </div>
    </Sheet>
  );

  if(step==="scan")return(
    <Sheet noClose>
      <div style={{textAlign:"center",padding:"44px 24px"}}>
        <div style={{display:"flex",gap:10,justifyContent:"center",marginBottom:22}}>
          {frontPrev&&<img src={frontPrev} alt="" style={{width:72,height:100,objectFit:"cover",borderRadius:12,boxShadow:t.sh}}/>}
          {backPrev&&<img src={backPrev} alt="" style={{width:72,height:100,objectFit:"cover",borderRadius:12,boxShadow:t.sh,opacity:.8}}/>}
        </div>
        <div style={{fontSize:17,fontWeight:700,color:t.tx,marginBottom:6}}>{backPrev?"Reading both sides...":"Reading card..."}</div>
        <div style={{color:t.tx3,fontSize:13,marginBottom:24}}>AI identifying player, parallel, serial number</div>
        <div style={{display:"flex",gap:8,justifyContent:"center"}}>
          {[0,1,2].map(i=>{const a="pulse 1.2s "+(i*.4)+"s infinite";return <div key={i} style={{width:10,height:10,borderRadius:"50%",background:t.acc,animation:a}}/>;})}</div>
      </div>
    </Sheet>
  );

  if(step==="res"&&result?._err)return(
    <Sheet>
      <div style={{textAlign:"center",padding:"40px 24px"}}>
        <div style={{fontSize:48,marginBottom:12}}>🚫</div>
        <div style={{fontSize:18,fontWeight:800,color:t.tx,marginBottom:8}}>Couldn't Read Card</div>
        <div style={{color:t.tx2,fontSize:14,lineHeight:1.65,marginBottom:22}}>{result._err}</div>
        <div style={{display:"flex",gap:10,justifyContent:"center",flexWrap:"wrap"}}>
          <Btn t={t} v="ghost" onClick={reset}>Try Again</Btn>
          {frontBlob&&!backBlob&&(
            <>
              <input id="errBackIn" ref={errBRef} type="file" accept="image/*" style={{display:"none"}} onChange={async e=>{const f=e.target.files?.[0];if(!f)return;e.target.value="";const r=await resizeImg(f);setBackPrev(URL.createObjectURL(r));setBackBlob(r);doAnalyze(frontBlob,r);}}/>
              <Btn t={t} v="fill" onClick={()=>errBRef.current?.click()}>Add Back Photo →</Btn>
            </>
          )}
        </div>
        <div style={{marginTop:16,color:t.tx3,fontSize:12,lineHeight:1.6}}>Tips: Good lighting, card flat, no glare.</div>
      </div>
    </Sheet>
  );

  if(step==="res"&&form)return(
    <Sheet>
      <Hdr title="Confirm Details"/>
      <div style={{padding:"0 20px 28px"}}>
        <div style={{display:"flex",gap:12,background:t.surf2,borderRadius:14,padding:12,marginBottom:16}}>
          {frontPrev&&<img src={frontPrev} alt="" style={{width:66,height:92,objectFit:"cover",borderRadius:10,flexShrink:0}}/>}
          <div style={{flex:1}}>
            <div style={{display:"flex",gap:6,marginBottom:6,flexWrap:"wrap"}}>
              <span style={{display:"inline-block",padding:"2px 10px",borderRadius:20,background:result.confidence==="high"?t.grnBg:result.confidence==="medium"?t.goldBg:t.redBg,color:result.confidence==="high"?t.grn:result.confidence==="medium"?t.gold:t.red,fontSize:11,fontWeight:700}}>
                {result.confidence==="high"?"✓ High":result.confidence==="medium"?"~ Medium":"? Low"}
              </span>
              {backPrev&&<span style={{display:"inline-block",padding:"2px 10px",borderRadius:20,background:t.grnBg,color:t.grn,fontSize:11,fontWeight:700}}>+ Back used</span>}
            </div>
            <div style={{fontSize:18,fontWeight:800,color:t.tx,lineHeight:1.2,marginBottom:4}}>{form.player||"Unknown"}</div>
            {form.notes&&<div style={{color:t.gold,fontSize:12}}>✦ {form.notes}</div>}
            {/* Live price display */}
            <div style={{marginTop:8,padding:"8px 10px",borderRadius:10,background:t.surf3,border:"1px solid "+t.bord}}>
              {form.ebayAvg?(
                <div style={{display:"flex",alignItems:"center",gap:8}}>
                  <span style={{fontSize:16}}>💰</span>
                  <div>
                    <div style={{fontSize:13,fontWeight:800,color:t.gold}}>Avg ${form.ebayAvg}{form.ebayLow?" · Low $"+form.ebayLow:""}</div>
                    <div style={{fontSize:11,color:t.tx3}}>{form._salesCount?" "+form._salesCount+" recent sales":""}{form._priceNote?" · "+form._priceNote:""}</div>
                  </div>
                </div>
              ):(
                <div style={{display:"flex",alignItems:"center",gap:8}}>
                  <div style={{width:12,height:12,borderRadius:"50%",background:t.acc,animation:"pulse 1.2s 0s infinite",flexShrink:0}}/>
                  <div style={{fontSize:12,color:t.tx3}}>Fetching eBay sold prices...</div>
                </div>
              )}
            </div>
          </div>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:12}}>
          <Inp label="Player" value={form.player} onChange={v=>setForm(f=>({...f,player:v}))} t={t} sx={{gridColumn:"1/-1"}}/>
          <Inp label="Year" value={form.year} onChange={v=>setForm(f=>({...f,year:v}))} t={t}/>
          <Inp label="Team" value={form.team} onChange={v=>setForm(f=>({...f,team:v}))} t={t}/>
          <Sel label="Sport" value={form.sport} onChange={v=>setForm(f=>({...f,sport:v}))} opts={SPORTS.slice(1)} t={t}/>
          <Sel label="Brand" value={form.brand} onChange={v=>setForm(f=>({...f,brand:v}))} opts={BRANDS.slice(1)} t={t}/>
          <Sel label="Type" value={form.type} onChange={v=>setForm(f=>({...f,type:v}))} opts={CTYPES.slice(1)} t={t}/>
          <Sel label="Parallel" value={form.parallel} onChange={v=>setForm(f=>({...f,parallel:v}))} opts={PARS} t={t}/>
          <Sel label="Condition" value={form.condition} onChange={v=>setForm(f=>({...f,condition:v}))} opts={CONDS.slice(1)} t={t}/>
          <Sel label="Folder" value={form.folder||"(none)"} onChange={v=>setForm(f=>({...f,folder:v==="(none)"?null:v}))} opts={["(none)",...folders.map(x=>x.name)]} t={t}/>
        </div>
        <div style={{display:"flex",gap:14,marginBottom:14,flexWrap:"wrap",alignItems:"center"}}>
          {[["graded","Graded"],["serialed","Serialed"]].map(([k,l])=>(
            <label key={k} style={{display:"flex",alignItems:"center",gap:7,color:t.tx2,fontSize:13,fontWeight:600,cursor:"pointer"}}>
              <input type="checkbox" checked={form[k]} onChange={e=>setForm(f=>({...f,[k]:e.target.checked}))} style={{accentColor:t.acc,width:15,height:15}}/>{l}
            </label>
          ))}
          {form.graded&&<Inp value={form.grade} onChange={v=>setForm(f=>({...f,grade:v}))} placeholder="PSA 10" t={t} sx={{width:100}}/>}
          {form.serialed&&<Inp value={form.serialNum} onChange={v=>setForm(f=>({...f,serialNum:v}))} placeholder="47/99" t={t} sx={{width:100}}/>}
        </div>
        <div style={{display:"flex",gap:10}}>
          <Btn t={t} v="ghost" onClick={reset} sx={{flex:1}}>Rescan</Btn>
          <Btn t={t} v="fill" sz="lg" onClick={doAdd} sx={{flex:2}}>Add to Vault</Btn>
        </div>
      </div>
    </Sheet>
  );
  return null;
}

                {[["graded","Graded"],["serialed","Serialed"]].map(([k,l])=>(
                  <label key={k} style={{display:"flex",alignItems:"center",gap:7,color:t.tx2,fontSize:13,fontWeight:600,cursor:"pointer"}}>
                    <input type="checkbox" checked={form[k]||false} onChange={e=>setForm(f=>({...f,[k]:e.target.checked}))} style={{accentColor:t.acc,width:15,height:15}}/>{l}
                  </label>
                ))}
                {form.graded&&<Inp value={form.grade||""} onChange={v=>setForm(f=>({...f,grade:v}))} placeholder="PSA 10" t={t} sx={{width:100}}/>}
                {form.serialed&&<Inp value={form.serialNum||""} onChange={v=>setForm(f=>({...f,serialNum:v}))} placeholder="47/99" t={t} sx={{width:100}}/>}
              </div>
            </div>
          )}

          <div style={{display:"flex",gap:10}}>
            <button onClick={()=>{if(window.confirm("Delete this card?"))onDelete(card.id);}} style={{padding:"11px 16px",borderRadius:12,border:"1px solid "+t.red,background:t.redBg,color:t.red,cursor:"pointer",fontSize:14,fontWeight:700}}>Delete</button>
            {ed?<Btn t={t} v="fill" sz="md" onClick={()=>{onUpdate(form);setEd(false);}} sx={{flex:1}}>Save Changes</Btn>:<Btn t={t} v="ghost" sz="md" onClick={onClose} sx={{flex:1}}>Close</Btn>}
          </div>
        </div>
      </div>
    </div>
  );
}

   FOLDER MODAL
═══════════════════════════════════════════════════════════ */
function FolderModal({folders,cards,onClose,onCreate,onDelete,onRename,onCover,t}){
  const[nm,setNm]=useState("");const[ren,setRen]=useState(null);const[rv,setRv]=useState("");
  const cRef=useRef();const[ct,setCt]=useState(null);
  return(
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.6)",zIndex:5000,display:"flex",alignItems:"flex-end",justifyContent:"center",backdropFilter:"blur(4px)"}} onClick={onClose}>
      <div onClick={e=>e.stopPropagation()} style={{background:t.surf,borderRadius:"24px 24px 0 0",width:"100%",maxWidth:460,border:"1px solid "+t.bord,maxHeight:"80vh",overflowY:"auto",boxShadow:t.shHov}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"20px 20px 4px"}}>
          <div style={{fontSize:18,fontWeight:900,color:t.tx,letterSpacing:-.3}}>Folders</div>
          <button onClick={onClose} style={{background:t.surf3,border:"none",color:t.tx2,width:32,height:32,borderRadius:16,cursor:"pointer",fontSize:20,lineHeight:"32px",textAlign:"center"}}>×</button>
        </div>
        <div style={{padding:"12px 20px 28px"}}>
          <div style={{display:"flex",gap:8,marginBottom:16}}>
            <input value={nm} onChange={e=>setNm(e.target.value)} placeholder="New folder name…" onKeyDown={e=>{if(e.key==="Enter"&&nm.trim()){onCreate(nm.trim());setNm("");}}}
              style={{flex:1,padding:"10px 14px",borderRadius:12,border:"1.5px solid "+t.bord,background:t.inp,color:t.tx,fontSize:14,outline:"none"}}
              onFocus={e=>e.target.style.borderColor=t.acc} onBlur={e=>e.target.style.borderColor=t.bord}/>
            <Btn t={t} v="fill" sz="sm" onClick={()=>{if(nm.trim()){onCreate(nm.trim());setNm("");}}}>Create</Btn>
          </div>
          <input ref={cRef} type="file" accept="image/*" style={{display:"none"}} onChange={e=>{
          const file=e.target.files?.[0];
          if(file&&ct){
            const r=new FileReader();
            r.onload=()=>{onCover(ct,r.result);setCt(null);};
            r.readAsDataURL(file);
          }
        }}/>
          <div style={{display:"flex",flexDirection:"column",gap:8}}>
            {folders.length===0&&<div style={{textAlign:"center",padding:"24px 0",color:t.tx3,fontSize:14}}>No folders yet.</div>}
            {folders.map(f=>{
              const fc=cards.filter(c=>c.folder===f.name);const fv=fc.reduce((s,c)=>s+(c.ebayAvg||0),0);
              return(
                <Card key={f.name} t={t} sx={{padding:12}}>
                  <div style={{display:"flex",alignItems:"center",gap:10}}>
                    <div style={{width:48,height:48,borderRadius:12,overflow:"hidden",flexShrink:0,background:t.surf2,cursor:"pointer"}} onClick={()=>{setCt(f.name);cRef.current?.click();}}>
                      {f.cover?<img src={f.cover} alt="" style={{width:"100%",height:"100%",objectFit:"cover"}}/>:<div style={{width:"100%",height:"100%",display:"flex",alignItems:"center",justifyContent:"center",fontSize:24}}>📁</div>}
                    </div>
                    {ren===f.name?(
                      <input autoFocus value={rv} onChange={e=>setRv(e.target.value)} onKeyDown={e=>{if(e.key==="Enter"){onRename(f.name,rv);setRen(null);}if(e.key==="Escape")setRen(null);}}
                        style={{flex:1,padding:"7px 10px",borderRadius:9,border:"1.5px solid "+t.acc,background:t.inp,color:t.tx,fontSize:13,outline:"none"}}/>
                    ):(
                      <div style={{flex:1}}>
                        <div style={{fontSize:14,fontWeight:700,color:t.tx}}>{f.name}</div>
                        <div style={{color:t.tx3,fontSize:12,marginTop:1}}>{fc.length} cards · {fv>0?fmt(fv):"$0"}</div>
                      </div>
                    )}
                    <div style={{display:"flex",gap:6}}>
                      <button onClick={()=>{setRen(f.name);setRv(f.name);}} style={{background:t.surf3,border:"1px solid "+t.bord,borderRadius:9,padding:"5px 9px",cursor:"pointer",fontSize:12,color:t.tx2}}>✏️</button>
                      <button onClick={()=>{if(window.confirm(`Delete "${f.name}"?`))onDelete(f.name);}} style={{background:t.redBg,border:"1px solid "+t.red+"40",borderRadius:9,padding:"5px 9px",cursor:"pointer",fontSize:12,color:t.red}}>🗑️</button>
                    </div>
                  </div>
                </Card>
              );
            })}
          </div>
        </div>
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════
   SETTINGS PAGE
═══════════════════════════════════════════════════════════ */
function SettingsPage({user,onUpdate,onBack,t,isAdminUser}){
  const[s,setS]=useState({...DS,...user.settings});
  const[p,setP]=useState({name:user.name||"",email:user.email||"",phone:user.phone||"",rec:user.recovery||"",recType:user.recoveryType||"email"});
  const[pw,setPw]=useState({cur:"",nw:"",conf:""});
  const[pwMsg,setPwMsg]=useState("");
  const[saved,setSaved]=useState(false);
  const[bioAvail,setBioAvail]=useState(false);
  const[bioMsg,setBioMsg]=useState("");

  useEffect(()=>{biometricAvailable().then(setBioAvail);},[]);

  const save=()=>{onUpdate({...user,name:p.name,email:p.email,phone:p.phone,recovery:p.rec,recoveryType:p.recType,settings:s});setSaved(true);setTimeout(()=>setSaved(false),2000);};
  const chPw=()=>{if(pw.cur!==user.password){setPwMsg("Current password incorrect.");return;}if(pw.nw.length<6){setPwMsg("Min 6 characters.");return;}if(pw.nw!==pw.conf){setPwMsg("Passwords don't match.");return;}onUpdate({...user,password:pw.nw});setPwMsg("✓ Password updated");setPw({cur:"",nw:"",conf:""});};

  const setupBio=async()=>{
    setBioMsg("Setting up biometrics...");
    const ok=await biometricRegister(user.id);
    if(ok){setS(x=>({...x,biometric:true}));setBioMsg("✓ Biometric sign-in enabled!");}
    else{setBioMsg("Setup failed. Try again or check browser permissions.");}
  };
  const removeBio=()=>{localStorage.removeItem("cv_biometric_id");setS(x=>({...x,biometric:false}));setBioMsg("Biometric sign-in removed.");};

  const Sec=({title,children})=><div style={{marginBottom:20}}>
    <div style={{fontSize:11,fontWeight:700,color:t.tx3,letterSpacing:.5,marginBottom:10,paddingLeft:4}}>{title}</div>
    <Card t={t} sx={{padding:0,overflow:"hidden"}}>
      {children}
    </Card>
  </div>;
  const Row=({label,sub,children,last})=><div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"14px 16px",borderBottom:last?"none":"1px solid "+t.bord}}>
    <div style={{flex:1,paddingRight:16}}><div style={{fontSize:15,color:t.tx,fontWeight:500}}>{label}</div>{sub&&<div style={{color:t.tx3,fontSize:12,marginTop:1}}>{sub}</div>}</div>
    {children}
  </div>;
  const inp={padding:"7px 10px",borderRadius:9,border:"1.5px solid "+t.bord,background:t.inp,color:t.tx,fontSize:13,outline:"none"};

  return(
    <div style={{background:t.bg,minHeight:"100vh"}}>
      <div style={{background:t.nav,borderBottom:"1px solid "+t.bord,padding:"14px 18px",display:"flex",alignItems:"center",gap:12,position:"sticky",top:0,zIndex:10,boxShadow:t.sh}}>
        <button onClick={onBack} style={{background:"none",border:"none",color:t.acc,fontSize:16,fontWeight:700,cursor:"pointer"}}>‹ Back</button>
        <div style={{fontSize:18,fontWeight:900,color:t.tx,letterSpacing:-.3}}>Settings</div>
      </div>
      <div style={{maxWidth:540,margin:"0 auto",padding:"20px 16px 80px"}}>
        <Sec title="PROFILE">
          <Row label="Name"><input value={p.name} onChange={e=>setP(x=>({...x,name:e.target.value}))} style={{...inp,width:160,textAlign:"right"}}/></Row>
          <Row label="Email"><input value={p.email} onChange={e=>setP(x=>({...x,email:e.target.value}))} type="email" style={{...inp,width:180,textAlign:"right"}}/></Row>
          <Row label="Phone"><input value={p.phone} onChange={e=>setP(x=>({...x,phone:e.target.value}))} type="tel" placeholder="+1 555 0000" style={{...inp,width:150,textAlign:"right"}}/></Row>
          <Row label="Recovery Method">
            <div style={{display:"flex",gap:6}}>
              {[["email","Email"],["phone","Phone"]].map(([v,l])=>(
                <button key={v} onClick={()=>setP(x=>({...x,recType:v}))} style={{padding:"6px 12px",borderRadius:9,border:"1.5px solid "+(p.recType===v?t.acc:t.bord),background:p.recType===v?t.accBg:"transparent",color:p.recType===v?t.acc:t.tx3,fontWeight:600,fontSize:12,cursor:"pointer"}}>{l}</button>
              ))}
            </div>
          </Row>
          <Row label="Recovery Contact" last><input value={p.rec} onChange={e=>setP(x=>({...x,rec:e.target.value}))} placeholder="backup@email.com" style={{...inp,width:180,textAlign:"right"}}/></Row>
        </Sec>

        <Sec title="CHANGE PASSWORD">
          <Row label="Current Password"><input type="password" value={pw.cur} onChange={e=>setPw(x=>({...x,cur:e.target.value}))} style={{...inp,width:150}}/></Row>
          <Row label="New Password"><input type="password" value={pw.nw} onChange={e=>setPw(x=>({...x,nw:e.target.value}))} style={{...inp,width:150}}/></Row>
          <Row label="Confirm Password" last><input type="password" value={pw.conf} onChange={e=>setPw(x=>({...x,conf:e.target.value}))} style={{...inp,width:150}}/></Row>
          {pwMsg&&<div style={{padding:"8px 16px",color:pwMsg.startsWith("✓")?t.grn:t.red,fontSize:13,fontWeight:600}}>{pwMsg}</div>}
          <div style={{padding:"12px 16px"}}><Btn t={t} v="ghost" sz="sm" onClick={chPw}>Update Password</Btn></div>
        </Sec>

        {bioAvail&&<Sec title="BIOMETRIC SIGN-IN">
          <Row label="Face ID / Fingerprint" sub="Sign in like your banking app — quick and secure" last>
            {s.biometric&&lsGet("cv_biometric_id",null)===user.id?(
              <Btn t={t} v="red" sz="sm" onClick={removeBio}>Remove</Btn>
            ):(
              <Btn t={t} v="fill" sz="sm" onClick={setupBio}>Set Up</Btn>
            )}
          </Row>
          {bioMsg&&<div style={{padding:"8px 16px",color:bioMsg.startsWith("✓")?t.grn:t.tx3,fontSize:13,fontWeight:600}}>{bioMsg}</div>}
        </Sec>}

        <Sec title="DISPLAY">
          <Row label="Dark Mode" sub="Switch to dark theme"><Sw on={s.darkMode} toggle={()=>setS(x=>({...x,darkMode:!x.darkMode}))} t={t}/></Row>
          <Row label="Show Values" sub="Display prices on cards"><Sw on={s.showValues} toggle={()=>setS(x=>({...x,showValues:!x.showValues}))} t={t}/></Row>
          <Row label="Default Sort" last>
            <select value={s.sortDefault} onChange={e=>setS(x=>({...x,sortDefault:e.target.value}))} style={{...inp,appearance:"none"}}>
              <option value="newest">Newest</option><option value="value_hi">Highest Value</option><option value="alpha">A–Z</option><option value="year_new">Newest Year</option>
            </select>
          </Row>
        </Sec>

        <Sec title="NOTIFICATIONS">
          <Row label="Push Notifications"><Sw on={s.notifications} toggle={()=>setS(x=>({...x,notifications:!x.notifications}))} t={t}/></Row>
          <Row label="Email Alerts"><Sw on={s.emailAlerts} toggle={()=>setS(x=>({...x,emailAlerts:!x.emailAlerts}))} t={t}/></Row>
          <Row label="SMS Alerts" last><Sw on={s.smsAlerts} toggle={()=>setS(x=>({...x,smsAlerts:!x.smsAlerts}))} t={t}/></Row>
        </Sec>

        <Sec title="PRIVACY">
          <Row label="Show on Leaderboard" sub="Let others see your ranking"><Sw on={s.shareCollection} toggle={()=>setS(x=>({...x,shareCollection:!x.shareCollection}))} t={t}/></Row>
          <Row label="Public Profile"><Sw on={s.profileVisible} toggle={()=>setS(x=>({...x,profileVisible:!x.profileVisible}))} t={t}/></Row>
          <Row label="Two-Factor Auth" sub="Extra login security" last><Sw on={s.twoFactor} toggle={()=>setS(x=>({...x,twoFactor:!x.twoFactor}))} t={t}/></Row>
        </Sec>

        <Btn t={t} v="fill" sz="full" onClick={save}>{saved?"✓ Saved!":"Save All Changes"}</Btn>
      </div>
    </div>
  );
}

}
