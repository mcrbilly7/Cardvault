   ADMIN PANEL
═══════════════════════════════════════════════════════════ */
function AdminPanel({users,notifs,onBack,onSend,onDismiss,onAnswer,onUpdUser,onUpdAllCards,globalPrices,onSetPrice,adminReqs,onApproveAdmin,onRejectAdmin,t,currentUser}){
  const[tab,setTab]=useState("pw");
  const[sel,setSel]=useState(null);
  const[viewUser,setViewUser]=useState(null);
  const[editCard,setEditCard]=useState(null);
  const[editVals,setEditVals]=useState({low:"",avg:""});
  const[answerDraft,setAnswerDraft]=useState({});
  const[newAdminEmail,setNewAdminEmail]=useState("");
  const[adminMsg,setAdminMsg]=useState("");

  const pwNotifs=notifs.filter(n=>n.type==="pw"||!n.type);
  const qNotifs=notifs.filter(n=>n.type==="question");
  const unreadPw=pwNotifs.filter(n=>!n.read).length;
  const unreadQ=qNotifs.filter(n=>!n.read).length;
  const pendingAdmins=adminReqs.filter(r=>r.status==="pending");

  const saveVal=()=>{
    if(!viewUser||!editCard)return;
    const low=editVals.low?Number(editVals.low):editCard.ebayLow;
    const avg=editVals.avg?Number(editVals.avg):editCard.ebayAvg;
    // Save to global price registry
    onSetPrice(editCard,low,avg);
    // Update this user's card
    const updCards=(viewUser.cards||[]).map(c=>c.id===editCard.id?{...c,ebayLow:low,ebayAvg:avg}:c);
    const updUser={...viewUser,cards:updCards};
    onUpdUser(updUser);
    setViewUser(updUser);
    setEditCard(null);setEditVals({low:"",avg:""});
  };

  const promoteToAdmin=()=>{
    if(!newAdminEmail.trim()){setAdminMsg("Enter an email.");return;}
    const u=users.find(x=>x.email.toLowerCase()===newAdminEmail.toLowerCase());
    if(!u){setAdminMsg("No account with that email.");return;}
    if(u.role==="super"){setAdminMsg("That's the super admin.");return;}
    if(u.role==="admin"){setAdminMsg("Already an admin.");return;}
    onUpdUser({...u,role:"admin",adminApproved:true});
    setNewAdminEmail("");setAdminMsg("✓ "+u.name+" is now an admin.");
  };
  const demoteAdmin=u=>{
    if(window.confirm(`Remove admin from ${u.name}?`))onUpdUser({...u,role:"user"});
  };

  // Viewing a user's collection
  if(viewUser)return(
    <div style={{background:t.bg,minHeight:"100vh"}}>
      <div style={{background:t.nav,borderBottom:"1px solid "+t.bord,padding:"14px 18px",display:"flex",alignItems:"center",gap:12,position:"sticky",top:0,zIndex:100,boxShadow:t.sh}}>
        <button onClick={()=>setViewUser(null)} style={{background:"none",border:"none",color:t.acc,fontSize:16,fontWeight:700,cursor:"pointer"}}>← Users</button>
        <div style={{flex:1}}>
          <div style={{fontSize:15,fontWeight:800,color:t.tx}}>{viewUser.name}'s Collection</div>
          <div style={{color:t.tx3,fontSize:11}}>{(viewUser.cards||[]).length} cards · ${(viewUser.cards||[]).reduce((s,c)=>s+(c.ebayAvg||0),0).toLocaleString()}</div>
        </div>
      </div>
      <div style={{maxWidth:600,margin:"0 auto",padding:"14px 16px 60px"}}>
        {(viewUser.cards||[]).length===0&&<div style={{textAlign:"center",padding:"60px 20px",color:t.tx3}}>No cards yet.</div>}
        {(viewUser.cards||[]).map(card=>(
          <Card key={card.id} t={t} sx={{padding:14,marginBottom:8}}>
            <div style={{display:"flex",alignItems:"center",gap:12}}>
              <div style={{width:44,height:62,borderRadius:10,overflow:"hidden",flexShrink:0,background:t.surf2}}>
                {card.image?<img src={card.image} alt={card.player} style={{width:"100%",height:"100%",objectFit:"cover"}}/>:<CardArt card={card} sm/>}
              </div>
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontSize:14,fontWeight:800,color:t.tx,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{card.player}</div>
                <div style={{color:t.tx3,fontSize:12}}>{card.year} {card.brand} · {card.type}</div>
                {card.parallel&&card.parallel!=="Base"&&<div style={{color:t.gold,fontSize:11,fontWeight:600}}>{card.parallel} Parallel</div>}
              </div>
              {editCard?.id===card.id?(
                <div style={{display:"flex",flexDirection:"column",gap:6,width:190}}>
                  <div style={{display:"flex",gap:6}}>
                    <div style={{flex:1}}>
                      <div style={{fontSize:10,color:t.tx3,fontWeight:700,marginBottom:2}}>LOW $</div>
                      <input type="number" value={editVals.low} onChange={e=>setEditVals(v=>({...v,low:e.target.value}))} placeholder={card.ebayLow||"0"}
                        style={{width:"100%",padding:"7px 8px",borderRadius:9,border:"1.5px solid "+t.acc,background:t.inp,color:t.tx,fontSize:13,outline:"none",boxSizing:"border-box"}}/>
                    </div>
                    <div style={{flex:1}}>
                      <div style={{fontSize:10,color:t.tx3,fontWeight:700,marginBottom:2}}>AVG $</div>
                      <input type="number" value={editVals.avg} onChange={e=>setEditVals(v=>({...v,avg:e.target.value}))} placeholder={card.ebayAvg||"0"}
                        style={{width:"100%",padding:"7px 8px",borderRadius:9,border:"1.5px solid "+t.acc,background:t.inp,color:t.tx,fontSize:13,outline:"none",boxSizing:"border-box"}}/>
                    </div>
                  </div>
                  <div style={{display:"flex",gap:6}}>
                    <button onClick={saveVal} style={{flex:2,padding:"7px",borderRadius:9,border:"none",background:t.gradBtn,color:"#fff",cursor:"pointer",fontSize:12,fontWeight:700}}>Save All</button>
                    <button onClick={()=>{setEditCard(null);setEditVals({low:"",avg:""}); }} style={{flex:1,padding:"7px",borderRadius:9,border:"1px solid "+t.bord,background:"none",color:t.tx2,cursor:"pointer",fontSize:12}}>×</button>
                  </div>
                  <div style={{fontSize:10,color:t.acc}}>⚡ Applies to all matching cards</div>
                </div>
              ):(
                <div style={{textAlign:"right",flexShrink:0}}>
                  <div style={{fontSize:16,fontWeight:900,color:card.ebayAvg?t.gold:t.tx3}}>{card.ebayAvg?"$"+card.ebayAvg:"—"}</div>
                  <button onClick={()=>{setEditCard(card);setEditVals({low:card.ebayLow||"",avg:card.ebayAvg||""});}} style={{marginTop:4,background:t.accBg,border:"none",color:t.acc,padding:"4px 10px",borderRadius:8,cursor:"pointer",fontSize:11,fontWeight:700}}>
                    {card.ebayAvg?"Edit":"Set Value"}
                  </button>
                </div>
              )}
            </div>
          </Card>
        ))}
      </div>
    </div>
  );

  const tabs=[
    {id:"pw",label:"🔑 Passwords",cnt:unreadPw},
    {id:"questions",label:"💬 Questions",cnt:unreadQ},
    {id:"users",label:"👥 Users",cnt:0},
    ...(isSuper(currentUser)?[{id:"admins",label:"⚡ Admins",cnt:pendingAdmins.length}]:[]),
  ];

  return(
    <div style={{background:t.bg,minHeight:"100vh"}}>
      <div style={{background:t.nav,borderBottom:"1px solid "+t.bord,padding:"14px 18px",display:"flex",justifyContent:"space-between",alignItems:"center",position:"sticky",top:0,zIndex:100,boxShadow:t.sh}}>
        <div style={{display:"flex",alignItems:"center",gap:10}}>
          <div style={{width:36,height:36,borderRadius:10,background:t.gradBtn,display:"flex",alignItems:"center",justifyContent:"center",fontSize:16}}>⚡</div>
          <div><div style={{fontSize:15,fontWeight:900,color:t.tx,letterSpacing:-.2}}>Admin Panel</div><div style={{color:t.tx3,fontSize:11}}>{isSuper(currentUser)?"Super Admin":"Admin"}</div></div>
        </div>
        <Btn t={t} v="ghost" sz="sm" onClick={onBack}>‹ My Vault</Btn>
      </div>
      <div style={{display:"flex",borderBottom:"1px solid "+t.bord,background:t.nav,overflowX:"auto"}}>
        {tabs.map(({id,label,cnt})=>(
          <button key={id} onClick={()=>setTab(id)} style={{flex:1,minWidth:80,padding:"11px 8px",background:"none",border:"none",cursor:"pointer",borderBottom:tab===id?"2.5px solid "+t.acc:"2.5px solid transparent",color:tab===id?t.acc:t.tx3,fontSize:12,fontWeight:700,position:"relative",whiteSpace:"nowrap"}}>
            {label}{cnt>0&&<span style={{marginLeft:4,background:t.red,borderRadius:10,padding:"1px 5px",fontSize:10,color:"#fff"}}>{cnt}</span>}
          </button>
        ))}
      </div>

      {/* PASSWORD REQUESTS */}
      {tab==="pw"&&<div style={{maxWidth:580,margin:"0 auto",padding:"16px 16px 40px"}}>
        {pwNotifs.length===0&&<div style={{textAlign:"center",padding:"60px 20px"}}><div style={{fontSize:44,marginBottom:12}}>🔔</div><div style={{fontSize:16,fontWeight:700,color:t.tx,marginBottom:6}}>No requests</div><div style={{color:t.tx2,fontSize:13}}>Password recovery requests will appear here.</div></div>}
        {pwNotifs.map(n=>(
          <Card key={n.id} t={t} sx={{padding:16,marginBottom:10,border:n.read?"1px solid "+t.bord:"1.5px solid "+t.gold}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:12}}>
              <div>
                <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:3}}>
                  <span style={{fontSize:14,fontWeight:800,color:t.tx}}>Password Recovery</span>
                  {!n.read&&<span style={{padding:"1px 7px",borderRadius:10,background:t.goldBg,color:t.gold,fontSize:11,fontWeight:800}}>New</span>}
                  {n.sent&&<span style={{padding:"1px 7px",borderRadius:10,background:t.grnBg,color:t.grn,fontSize:11,fontWeight:700}}>✓ Sent</span>}
                </div>
                <div style={{color:t.tx3,fontSize:12}}>{n.time}</div>
              </div>
            </div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,background:t.surf2,borderRadius:12,padding:12,marginBottom:12}}>
              {[["User",n.userName],["Email",n.userEmail],["Recovery","("+n.recoveryType+") "+n.recovery]].map(([k,v])=>(
                <div key={k} style={k==="Recovery"?{gridColumn:"1/-1"}:{}}>
                  <div style={{color:t.tx3,fontSize:10,fontWeight:700,letterSpacing:.5,marginBottom:2}}>{k.toUpperCase()}</div>
                  <div style={{color:t.tx,fontSize:13,fontWeight:600}}>{v}</div>
                </div>
              ))}
              <div style={{gridColumn:"1/-1",paddingTop:10,marginTop:6,borderTop:"1px solid "+t.bord}}>
                <div style={{color:t.tx3,fontSize:10,fontWeight:700,letterSpacing:.5,marginBottom:4}}>TEMP PASSWORD TO SEND</div>
                <div style={{color:t.grn,fontSize:22,fontWeight:900,fontFamily:"'Courier New',monospace",letterSpacing:3}}>{n.tempPass}</div>
              </div>
            </div>
            <div style={{display:"flex",gap:8}}>
              {!n.sent?<Btn t={t} v="grn" sz="sm" onClick={()=>onSend(n.id)} sx={{flex:2}}>✓ Mark as Sent</Btn>
                :<div style={{flex:2,padding:"8px 14px",borderRadius:10,background:t.grnBg,color:t.grn,fontSize:13,fontWeight:700,textAlign:"center"}}>✓ Sent</div>}
              <Btn t={t} v="ghost" sz="sm" onClick={()=>onDismiss(n.id)}>Dismiss</Btn>
            </div>
          </Card>
        ))}
      </div>}

      {/* QUESTIONS */}
      {tab==="questions"&&<div style={{maxWidth:580,margin:"0 auto",padding:"16px 16px 40px"}}>
        {qNotifs.length===0&&<div style={{textAlign:"center",padding:"60px 20px"}}><div style={{fontSize:44,marginBottom:12}}>💬</div><div style={{fontSize:16,fontWeight:700,color:t.tx,marginBottom:6}}>No questions</div><div style={{color:t.tx2,fontSize:13}}>User questions from the Help page appear here.</div></div>}
        {qNotifs.map(n=>(
          <Card key={n.id} t={t} sx={{padding:16,marginBottom:10,border:n.read?"1px solid "+t.bord:"1.5px solid "+t.acc}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:12}}>
              <div>
                <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:3}}>
                  <span style={{fontSize:14,fontWeight:800,color:t.tx}}>User Question</span>
                  {!n.read&&<span style={{padding:"1px 7px",borderRadius:10,background:t.accBg,color:t.acc,fontSize:11,fontWeight:800}}>New</span>}
                  {n.answered&&<span style={{padding:"1px 7px",borderRadius:10,background:t.grnBg,color:t.grn,fontSize:11,fontWeight:700}}>✓ Answered</span>}
                </div>
                <div style={{color:t.tx3,fontSize:12}}>{n.time}</div>
              </div>
            </div>
            <div style={{background:t.surf2,borderRadius:12,padding:12,marginBottom:12}}>
              <div style={{color:t.tx3,fontSize:10,fontWeight:700,marginBottom:4}}>FROM</div>
              <div style={{color:t.tx,fontSize:13,fontWeight:600,marginBottom:10}}>{n.userName} · {n.userEmail}</div>
              <div style={{color:t.tx3,fontSize:10,fontWeight:700,marginBottom:4}}>QUESTION</div>
              <div style={{color:t.tx,fontSize:14,lineHeight:1.6}}>{n.question}</div>
            </div>
            {!n.answered&&<>
              <textarea value={answerDraft[n.id]||""} onChange={e=>setAnswerDraft(d=>({...d,[n.id]:e.target.value}))}
                placeholder="Record your answer (optional — you can also reply directly by email)…" rows={3}
                style={{width:"100%",padding:"10px 14px",borderRadius:12,border:"1.5px solid "+t.bord,background:t.inp,color:t.tx,fontSize:13,outline:"none",resize:"none",boxSizing:"border-box",fontFamily:"inherit",marginBottom:10}}/>
              <div style={{display:"flex",gap:8}}>
                <Btn t={t} v="fill" sz="sm" onClick={()=>{onAnswer(n.id,answerDraft[n.id]||"");}} sx={{flex:2}}>✓ Mark as Answered</Btn>
                <Btn t={t} v="ghost" sz="sm" onClick={()=>onDismiss(n.id)}>Dismiss</Btn>
              </div>
            </>}
            {n.answered&&<Btn t={t} v="ghost" sz="sm" onClick={()=>onDismiss(n.id)}>Dismiss</Btn>}
          </Card>
        ))}
      </div>}

      {/* USERS */}
      {tab==="users"&&<div style={{maxWidth:580,margin:"0 auto",padding:"16px 16px 40px"}}>
        <div style={{fontSize:11,fontWeight:700,color:t.tx3,letterSpacing:.5,marginBottom:12}}>{users.filter(u=>u.role==="user").length} REGISTERED USERS</div>
        {users.filter(u=>u.role==="user").map(u=>(
          <Card key={u.id} t={t} sx={{marginBottom:8,padding:0,overflow:"hidden"}}>
            <div style={{padding:"14px 16px",display:"flex",alignItems:"center",gap:12}}>
              <Av name={u.name}/>
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontSize:15,fontWeight:800,color:t.tx}}>{u.name}</div>
                <div style={{color:t.tx3,fontSize:12}}>{u.email}</div>
                <div style={{color:t.tx3,fontSize:11,marginTop:2}}>{(u.cards||[]).length} cards · <span style={{color:t.gold,fontWeight:700}}>${(u.cards||[]).reduce((s,c)=>s+(c.ebayAvg||0),0).toLocaleString()}</span></div>
              </div>
              <button onClick={()=>setViewUser(u)} style={{background:t.accBg,border:"none",color:t.acc,padding:"8px 14px",borderRadius:11,cursor:"pointer",fontSize:13,fontWeight:700,flexShrink:0}}>View →</button>
            </div>
            <div onClick={()=>setSel(sel?.id===u.id?null:u)} style={{padding:"8px 16px",borderTop:"1px solid "+t.bord,cursor:"pointer",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
              <span style={{color:t.tx3,fontSize:12}}>Account details</span>
              <span style={{color:t.tx3,fontSize:14,transform:sel?.id===u.id?"rotate(180deg)":"none",transition:"transform .2s",display:"block"}}>⌄</span>
            </div>
            {sel?.id===u.id&&<div style={{padding:"0 16px 14px",borderTop:"1px solid "+t.bord}}>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginTop:10}}>
                {[["Phone",u.phone||"—"],["Recovery",u.recoveryType||"email"],["Rec. Contact",u.recovery||"—"],["Joined",u.createdAt],["Folders",(u.folders||[]).length],["Wishlist",(u.wishlist||[]).length+" items"],["Leaderboard",u.settings?.shareCollection!==false?"Yes":"No"],["Dark Mode",u.settings?.darkMode?"On":"Off"]].map(([k,v])=>(
                  <div key={k} style={{background:t.surf2,borderRadius:10,padding:"9px 10px"}}>
                    <div style={{color:t.tx3,fontSize:10,fontWeight:700,marginBottom:2}}>{k.toUpperCase()}</div>
                    <div style={{color:t.tx,fontSize:13,fontWeight:700}}>{v}</div>
                  </div>
                ))}
              </div>
            </div>}
          </Card>
        ))}
        {users.filter(u=>u.role==="user").length===0&&<div style={{textAlign:"center",padding:"60px 20px",color:t.tx3,fontSize:14}}>No users registered yet.</div>}
      </div>}

      {/* ADMINS (super only) */}
      {tab==="admins"&&isSuper(currentUser)&&<div style={{maxWidth:580,margin:"0 auto",padding:"16px 16px 40px"}}>

        {/* Promote new admin */}
        <Card t={t} sx={{padding:18,marginBottom:20}}>
          <div style={{fontSize:15,fontWeight:800,color:t.tx,marginBottom:4}}>Add New Admin</div>
          <div style={{color:t.tx3,fontSize:13,marginBottom:14}}>Enter the email of an existing user to promote them to admin. They cannot create other admins without your approval.</div>
          <div style={{display:"flex",gap:8,marginBottom:10}}>
            <input value={newAdminEmail} onChange={e=>{setNewAdminEmail(e.target.value);setAdminMsg("");}} placeholder="user@email.com"
              style={{flex:1,padding:"10px 14px",borderRadius:11,border:"1.5px solid "+t.bord,background:t.inp,color:t.tx,fontSize:14,outline:"none"}}
              onFocus={e=>e.target.style.borderColor=t.acc} onBlur={e=>e.target.style.borderColor=t.bord}
              onKeyDown={e=>{if(e.key==="Enter")promoteToAdmin();}}/>
            <Btn t={t} v="fill" sz="sm" onClick={promoteToAdmin}>Promote</Btn>
          </div>
          {adminMsg&&<div style={{color:adminMsg.startsWith("✓")?t.grn:t.red,fontSize:13,fontWeight:600}}>{adminMsg}</div>}
        </Card>

        {/* Pending admin requests */}
        {pendingAdmins.length>0&&<>
          <div style={{fontSize:11,fontWeight:700,color:t.tx3,letterSpacing:.5,marginBottom:10}}>PENDING ADMIN REQUESTS</div>
          {pendingAdmins.map(r=>(
            <Card key={r.id} t={t} sx={{padding:16,marginBottom:8,border:"1.5px solid "+t.gold}}>
              <div style={{fontSize:14,fontWeight:800,color:t.tx,marginBottom:4}}>{r.requestedBy} wants to make {r.targetName} an admin</div>
              <div style={{color:t.tx3,fontSize:12,marginBottom:12}}>{r.targetEmail} · Requested {r.time}</div>
              <div style={{display:"flex",gap:8}}>
                <Btn t={t} v="grn" sz="sm" onClick={()=>onApproveAdmin(r.id)} sx={{flex:1}}>✓ Approve</Btn>
                <Btn t={t} v="red" sz="sm" onClick={()=>onRejectAdmin(r.id)} sx={{flex:1}}>✗ Reject</Btn>
              </div>
            </Card>
          ))}
        </>}

        {/* Current admins */}
        <div style={{fontSize:11,fontWeight:700,color:t.tx3,letterSpacing:.5,marginBottom:10,marginTop:8}}>CURRENT ADMINS</div>
        {users.filter(u=>u.role==="admin"||u.role==="super").map(u=>(
          <Card key={u.id} t={t} sx={{padding:14,marginBottom:8}}>
            <div style={{display:"flex",alignItems:"center",gap:12}}>
              <Av name={u.name}/>
              <div style={{flex:1}}>
                <div style={{fontSize:14,fontWeight:800,color:t.tx}}>{u.name}</div>
                <div style={{color:t.tx3,fontSize:12}}>{u.email}</div>
              </div>
              <div style={{display:"flex",gap:6,alignItems:"center"}}>
                <span style={{padding:"3px 10px",borderRadius:20,background:u.role==="super"?t.goldBg:t.accBg,color:u.role==="super"?t.gold:t.acc,fontSize:11,fontWeight:700}}>{u.role==="super"?"Super":"Admin"}</span>
                {u.role==="admin"&&<button onClick={()=>demoteAdmin(u)} style={{background:t.redBg,border:"1px solid "+t.red+"40",color:t.red,borderRadius:9,padding:"4px 10px",cursor:"pointer",fontSize:11,fontWeight:700}}>Remove</button>}
              </div>
            </div>
          </Card>
        ))}
      </div>}
    </div>
  );
}

/* ═══════════════════════════════════════════════════════════
   MAIN VAULT APP
═══════════════════════════════════════════════════════════ */
function Vault({user,allUsers,onUpdUser,onLogout,onGoAdmin,notifs,theme,setTheme,onQuestion,globalPrices,onSetPrice,onUpdAllCards,adminReqs,onApproveAdmin,onRejectAdmin,onAnswer,onSend,onDismiss}){
  const t=theme;
  const[cards,setCards]=useState(()=>{
    // Apply global prices to existing cards on load
    const gp=initPrices();
    return (user.cards||[]).map(c=>{const k=priceKey(c);return gp[k]?{...c,ebayLow:gp[k].low,ebayAvg:gp[k].avg}:c;});
  });
  const[folders,setFolders]=useState(user.folders||[]);
  const[wl,setWl]=useState(user.wishlist||[]);
  const[settings,setSettings]=useState({...DS,...user.settings});
  const[view,setView]=useState("home");
  const[aF,setAF]=useState(null);
  const[scanning,setScanning]=useState(false);
  const[sel,setSel]=useState(null);
  const[showF,setShowF]=useState(false);
  const[showWl,setShowWl]=useState(false);
  const[search,setSearch]=useState("");
  const[filters,setFilters]=useState({sport:"All Sports",type:"All Types",cond:"All Conditions",brand:"All Brands",par:"All Parallels"});
  const[sort,setSort]=useState(settings.sortDefault||"newest");
  const[listMode,setListMode]=useState(false);
  const[selMode,setSelMode]=useState(false);
  const[selIds,setSelIds]=useState(new Set());
  const[showTour,setShowTour]=useState(false);
  const[showAdmin,setShowAdmin]=useState(false);

  // Sync back to parent + localStorage on change
  const syncRef=useRef(false);
  useEffect(()=>{if(!syncRef.current){syncRef.current=true;return;}onUpdUser({...user,cards,folders,wishlist:wl,settings});},[cards,folders,wl,settings]);

  const addCard=c=>{
    // Apply global price if exists
    const gp=initPrices();const k=priceKey(c);
    const priced=gp[k]?{...c,ebayLow:gp[k].low,ebayAvg:gp[k].avg}:c;
    setCards(p=>[priced,...p]);
  };
  const updCard=c=>{setCards(p=>p.map(x=>x.id===c.id?c:x));setSel(c);};
  const delCard=id=>{setCards(p=>p.filter(x=>x.id!==id));setSel(null);};
  const mkF=n=>{if(!folders.find(f=>f.name===n))setFolders(f=>[...f,{name:n,cover:null}]);};
  const rmF=n=>{setFolders(f=>f.filter(x=>x.name!==n));setCards(p=>p.map(c=>c.folder===n?{...c,folder:null}:c));};
  const rnF=(o,n)=>{setFolders(f=>f.map(x=>x.name===o?{...x,name:n}:x));setCards(p=>p.map(c=>c.folder===o?{...c,folder:n}:c));};
  const cvF=(name,url)=>setFolders(f=>f.map(x=>x.name===name?{...x,cover:url}:x));
  const mvSel=folder=>{setCards(p=>p.map(c=>selIds.has(c.id)?{...c,folder}:c));setSelIds(new Set());setSelMode(false);};
  const dlSel=()=>{if(window.confirm(`Delete ${selIds.size} cards?`)){setCards(p=>p.filter(c=>!selIds.has(c.id)));setSelIds(new Set());setSelMode(false);}};
  const exportCSV=()=>{
    const H=["Player","Sport","Year","Brand","Type","Parallel","Team","Condition","Graded","Grade","Serialed","Serial#","Folder","Low $","Avg $","Notes"];
    const R=cards.map(c=>[c.player,c.sport,c.year,c.brand,c.type,c.parallel||"Base",c.team,c.condition,c.graded?"Yes":"No",c.grade||"",c.serialed?"Yes":"No",c.serialNum||"",c.folder||"",c.ebayLow||"",c.ebayAvg||"",c.notes||""]);
    const csv=[H,...R].map(r=>r.map(v=>'"'+String(v||"").replace(/"/g,'""')+'"').join(",")).join("\n");
    const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download="card-vault.csv";a.click();
  };

  // Apply global price update to this user's cards
  const handleSetPrice=(card,low,avg)=>{
    onSetPrice(card,low,avg);
    setCards(p=>p.map(c=>{const k=priceKey(c);return k===priceKey(card)?{...c,ebayLow:low,ebayAvg:avg}:c;}));
  };

  const filtered=cards.filter(c=>{
    if(aF&&c.folder!==aF)return false;
    const q=search.toLowerCase();
    return(!q||[c.player,c.team,c.year,c.brand,c.notes].some(x=>x?.toLowerCase().includes(q)))
      &&(filters.sport==="All Sports"||c.sport===filters.sport)
      &&(filters.type==="All Types"||c.type===filters.type)
      &&(filters.cond==="All Conditions"||c.condition===filters.cond)
      &&(filters.brand==="All Brands"||c.brand===filters.brand)
      &&(filters.par==="All Parallels"||(c.parallel||"Base")===filters.par);
  }).sort((a,b)=>{
    if(sort==="newest")return b.id>a.id?1:-1;
    if(sort==="value_hi")return(b.ebayAvg||0)-(a.ebayAvg||0);
    if(sort==="value_lo")return(a.ebayAvg||0)-(b.ebayAvg||0);
    if(sort==="alpha")return(a.player||"").localeCompare(b.player||"");
    if(sort==="year_new")return(b.year||0)-(a.year||0);
    return 0;
  });

  const best=topC(cards);
  const unread=notifs.filter(n=>!n.read).length;
  const userIsAdmin=isAdmin(user);

  // Leaderboard
  const board=allUsers.map(u=>u.id===user.id?{...u,cards,settings}:u)
    .filter(u=>!isAdmin(u)&&u.settings?.shareCollection!==false&&tv(u.cards||[])>0)
    .map(u=>({...u,total:tv(u.cards||[])})).sort((a,b)=>b.total-a.total);
  const boardMax=board.length?board[0].total:1;
  const medals=["🥇","🥈","🥉"];

  if(showAdmin)return(
    <AdminPanel users={allUsers} notifs={notifs} onBack={()=>setShowAdmin(false)} onSend={onSend} onDismiss={onDismiss} onAnswer={onAnswer}
      onUpdUser={u=>{onUpdUser(u);if(u.id===user.id)setCards(u.cards||[]);}} onSetPrice={handleSetPrice} globalPrices={globalPrices}
      adminReqs={adminReqs} onApproveAdmin={onApproveAdmin} onRejectAdmin={onRejectAdmin} t={t} currentUser={user}/>
  );

  if(view==="settings")return(
    <div style={{position:"fixed",inset:0,zIndex:400,background:t.bg,overflowY:"auto"}}>
      <SettingsPage user={{...user,settings}} onUpdate={u=>{const ns={...DS,...u.settings};setSettings(ns);setTheme(ns.darkMode?DK:LT);onUpdUser(u);}} onBack={()=>setView("home")} t={t} isAdminUser={userIsAdmin}/>
    </div>
  );
  if(view==="help")return(
    <div style={{position:"fixed",inset:0,zIndex:400,background:t.bg,overflowY:"auto"}}>
      <HelpPage onBack={()=>setView("home")} onTour={()=>{setView("home");setShowTour(true);}} onQuestion={onQuestion} user={user} t={t}/>
    </div>
  );

  /* ── NAV ── */
  const NAV=[
    {id:"home",icon:<svg width={20} height={20} viewBox="0 0 20 20" fill="none"><path d="M3 9.5L10 3l7 6.5V17a1 1 0 01-1 1H4a1 1 0 01-1-1V9.5z" stroke="currentColor" strokeWidth="1.7"/><rect x="7.5" y="12" width="5" height="6" rx=".5" stroke="currentColor" strokeWidth="1.5"/></svg>,label:"Home"},
    {id:"collection",icon:<svg width={20} height={20} viewBox="0 0 20 20" fill="none"><rect x="2" y="3" width="11" height="15" rx="2" stroke="currentColor" strokeWidth="1.7"/><rect x="5" y="1" width="11" height="15" rx="2" stroke="currentColor" strokeWidth="1.5"/><rect x="8" y="4" width="6" height="4" rx="1" stroke="currentColor" strokeWidth="1.3"/></svg>,label:"Collection"},
    {id:"stats",icon:<svg width={20} height={20} viewBox="0 0 20 20" fill="none"><rect x="2" y="12" width="4" height="6" rx="1" fill="currentColor" opacity=".5"/><rect x="8" y="8" width="4" height="10" rx="1" fill="currentColor" opacity=".7"/><rect x="14" y="4" width="4" height="14" rx="1" fill="currentColor"/></svg>,label:"Stats"},
    {id:"ranks",icon:<svg width={20} height={20} viewBox="0 0 20 20" fill="none"><path d="M10 2l2 5h5l-4 3 1.5 5L10 12l-4.5 3L7 10 3 7h5L10 2z" stroke="currentColor" strokeWidth="1.5" strokeLinejoin="round"/></svg>,label:"Ranks"},
    {id:"help",icon:<svg width={20} height={20} viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="8" stroke="currentColor" strokeWidth="1.7"/><path d="M7.5 7.5a2.5 2.5 0 015 0c0 1.5-2.5 2-2.5 4" stroke="currentColor" strokeWidth="1.7" strokeLinecap="round"/><circle cx="10" cy="15" r=".9" fill="currentColor"/></svg>,label:"Help"},
  ];

  return(
    <div style={{minHeight:"100vh",background:t.bg,maxWidth:900,margin:"0 auto",fontFamily:"-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"}}>

      {/* ── HEADER ── */}
      <div style={{background:t.nav,borderBottom:"1px solid "+t.bord,padding:"12px 16px",display:"flex",alignItems:"center",justifyContent:"space-between",position:"sticky",top:0,zIndex:200,boxShadow:t.sh}}>
        <div onClick={()=>{setView("home");setAF(null);}} style={{cursor:"pointer",display:"flex",alignItems:"center",gap:10}}>
          <div style={{width:34,height:34,borderRadius:10,background:t.gradBtn,display:"flex",alignItems:"center",justifyContent:"center",boxShadow:"0 4px 12px rgba(108,61,251,.4)"}}>
            <svg width="18" height="18" viewBox="0 0 28 28" fill="none"><rect x="3" y="1.5" width="18" height="25" rx="2.5" stroke="white" strokeWidth="1.8" fill="rgba(255,255,255,0.2)"/><rect x="6" y="4.5" width="12" height="8" rx="1.5" stroke="white" strokeWidth="1.3" fill="rgba(255,255,255,0.2)"/><line x1="6" y1="15.5" x2="18" y2="15.5" stroke="white" strokeWidth="1.4" strokeLinecap="round"/><line x1="6" y1="18.5" x2="14" y2="18.5" stroke="white" strokeWidth="1.4" strokeLinecap="round"/><line x1="6" y1="21.5" x2="11" y2="21.5" stroke="white" strokeWidth="1.4" strokeLinecap="round"/></svg>
          </div>
          <div>
            <div style={{fontSize:16,fontWeight:900,color:t.tx,letterSpacing:-.4}}>Card Vault</div>
            <div style={{color:t.tx3,fontSize:10,fontWeight:600}}>{cards.length} cards · {tv(cards)>0?fmt(tv(cards)):"$0"}</div>
          </div>
        </div>
        <div style={{display:"flex",gap:6,alignItems:"center"}}>
          {userIsAdmin&&<button onClick={()=>setShowAdmin(true)} style={{position:"relative",background:t.accBg,border:"none",color:t.acc,borderRadius:10,padding:"7px 10px",cursor:"pointer",fontSize:14,fontWeight:800}}>
            ⚡{unread>0&&<span style={{position:"absolute",top:-4,right:-4,background:t.red,borderRadius:"50%",width:15,height:15,display:"flex",alignItems:"center",justifyContent:"center",fontSize:9,color:"#fff",fontWeight:800}}>{unread}</span>}
          </button>}
          <button onClick={()=>setShowWl(true)} style={{background:t.surf2,border:"1px solid "+t.bord,color:t.tx2,borderRadius:10,padding:"7px 10px",cursor:"pointer",fontSize:14}}>★</button>
          <button onClick={()=>setShowF(true)} style={{background:t.surf2,border:"1px solid "+t.bord,color:t.tx2,borderRadius:10,padding:"7px 10px",cursor:"pointer",fontSize:13}}>📁</button>
          <button onClick={exportCSV} style={{background:t.surf2,border:"1px solid "+t.bord,color:t.tx2,borderRadius:10,padding:"7px 10px",cursor:"pointer",fontSize:13}}>↓</button>
          <InstallButton t={t}/>
          <button onClick={()=>setView("settings")} style={{background:t.surf2,border:"1px solid "+t.bord,color:t.tx2,borderRadius:10,padding:"7px 10px",cursor:"pointer",fontSize:14}}>⚙</button>
          <button onClick={()=>setScanning(true)} style={{background:t.gradBtn,border:"none",color:"#fff",borderRadius:11,padding:"8px 16px",cursor:"pointer",fontSize:13,fontWeight:800,boxShadow:"0 4px 14px rgba(108,61,251,.4)"}}>+ Scan</button>
        </div>
      </div>

      {/* ── BOTTOM NAV ── */}
      <div style={{position:"fixed",bottom:0,left:"50%",transform:"translateX(-50%)",width:"100%",maxWidth:900,background:t.nav,borderTop:"1px solid "+t.bord,display:"flex",zIndex:200,boxShadow:"0 -2px 12px rgba(0,0,0,.08)"}}>
        {NAV.map(n=>(
          <button key={n.id} onClick={()=>{setView(n.id);if(n.id!=="collection")setAF(null);}} style={{flex:1,padding:"10px 4px 8px",background:"none",border:"none",cursor:"pointer",color:view===n.id?t.acc:t.tx3,display:"flex",flexDirection:"column",alignItems:"center",gap:3,transition:"color .15s"}}>
            {n.icon}<span style={{fontSize:10,fontWeight:700}}>{n.label}</span>
          </button>
        ))}
      </div>

      {/* ═════ HOME ═════ */}
      {view==="home"&&<div style={{padding:"16px 16px 90px"}}>
        {/* Hero: top card */}
        {best?(
          <div onClick={()=>setSel(best)} style={{borderRadius:22,overflow:"hidden",marginBottom:18,cursor:"pointer",position:"relative",boxShadow:t.shHov}}>
            <div style={{background:t.gradHero,padding:"20px 18px 18px",display:"flex",gap:16,alignItems:"center",position:"relative"}}>
              <div style={{position:"absolute",top:-30,right:-30,width:160,height:160,borderRadius:"50%",background:best.color+"30",filter:"blur(40px)"}}/>
              <div style={{position:"absolute",top:0,left:0,right:0,bottom:0,background:"linear-gradient(135deg,"+t.acc+"15,transparent)"}}>
                {/* sparkle bg */}
              </div>
              <div style={{width:90,height:126,borderRadius:14,overflow:"hidden",flexShrink:0,boxShadow:"0 8px 30px rgba(0,0,0,.5)",border:best.parallel&&best.parallel!=="Base"?"2px solid #FBBF24":"1px solid rgba(255,255,255,.2)",position:"relative",zIndex:1}}>
                {best.image?<img src={best.image} alt={best.player} style={{width:"100%",height:"100%",objectFit:"cover"}}/>:<CardArt card={best}/>}
              </div>
              <div style={{flex:1,position:"relative",zIndex:1}}>
                <div style={{fontSize:10,fontWeight:800,color:"#FBBF24",letterSpacing:1,marginBottom:4}}>👑 HIGHEST VALUED CARD</div>
                <div style={{fontSize:22,fontWeight:900,color:"#fff",lineHeight:1.15,marginBottom:4,letterSpacing:-.5}}>{best.player}</div>
                <div style={{color:"rgba(255,255,255,.5)",fontSize:12,marginBottom:10}}>{best.year} {best.brand}{best.parallel&&best.parallel!=="Base"?" · "+best.parallel+" Parallel":""}</div>
                {best.ebayAvg&&<div style={{display:"inline-flex",alignItems:"baseline",gap:4,background:"rgba(251,191,36,.15)",borderRadius:10,padding:"5px 12px",border:"1px solid rgba(251,191,36,.3)"}}>
                  <span style={{fontSize:22,fontWeight:900,color:"#FBBF24"}}>{fmt(best.ebayAvg)}</span>
                  <span style={{color:"rgba(255,255,255,.4)",fontSize:11,fontWeight:600}}>est.</span>
                </div>}
              </div>
            </div>
          </div>
        ):(
          <div onClick={()=>setScanning(true)} style={{borderRadius:22,overflow:"hidden",marginBottom:18,cursor:"pointer",background:t.gradHero,padding:"32px 24px",textAlign:"center",boxShadow:t.shHov}}>
            <div style={{fontSize:40,marginBottom:10}}>📸</div>
            <div style={{fontSize:20,fontWeight:900,color:"#fff",marginBottom:6,letterSpacing:-.3}}>Scan your first card</div>
            <div style={{color:"rgba(255,255,255,.5)",fontSize:14}}>Tap to add a card to your vault</div>
          </div>
        )}

        {/* Stats strip */}
        <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:8,marginBottom:18}}>
          {[["Cards",cards.length,t.acc],["Value",tv(cards)>0?fmt(tv(cards)):"$0",t.gold],["Rookies",cards.filter(c=>c.type==="Rookie").length,t.grn],["Graded",cards.filter(c=>c.graded).length,t.tx3]].map(([l,v,clr])=>(
            <Card key={l} t={t} sx={{padding:"12px 8px",textAlign:"center",background:t.surf2}}>
              <div style={{fontSize:17,fontWeight:900,color:clr}}>{v}</div>
              <div style={{color:t.tx3,fontSize:10,fontWeight:700,marginTop:2}}>{l.toUpperCase()}</div>
            </Card>
          ))}
        </div>

        {/* Folders */}
        {folders.length>0&&<div style={{marginBottom:18}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
            <div style={{fontSize:14,fontWeight:800,color:t.tx,letterSpacing:-.2}}>Folders</div>
            <button onClick={()=>setShowF(true)} style={{background:"none",border:"none",color:t.acc,fontSize:13,fontWeight:700,cursor:"pointer"}}>Manage</button>
          </div>
          <div style={{display:"flex",gap:10,flexWrap:"wrap"}}>
            {folders.map(f=>{const fc=cards.filter(c=>c.folder===f.name);return(
              <Card key={f.name} t={t} sx={{display:"flex",alignItems:"center",overflow:"hidden",cursor:"pointer",padding:0,minWidth:140}} onClick={()=>{setView("collection");setAF(f.name);}}>
                <div style={{width:46,height:46,flexShrink:0,overflow:"hidden",background:t.surf2}}>
                  {f.cover?<img src={f.cover} alt={f.name} style={{width:"100%",height:"100%",objectFit:"cover"}}/>:<div style={{width:"100%",height:"100%",display:"flex",alignItems:"center",justifyContent:"center",fontSize:22}}>📁</div>}
                </div>
                <div style={{padding:"6px 12px"}}>
                  <div style={{fontSize:13,fontWeight:700,color:t.tx,whiteSpace:"nowrap"}}>{f.name}</div>
                  <div style={{color:t.tx3,fontSize:11}}>{fc.length} cards</div>
                </div>
              </Card>
            );})}
          </div>
        </div>}

        {/* Recent cards */}
        {cards.length>0&&<div>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
            <div style={{fontSize:14,fontWeight:800,color:t.tx,letterSpacing:-.2}}>Recently Added</div>
            <button onClick={()=>setView("collection")} style={{background:"none",border:"none",color:t.acc,fontSize:13,fontWeight:700,cursor:"pointer"}}>View All</button>
          </div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(90px,1fr))",gap:8}}>
            {cards.slice(0,12).map(c=>(
              <div key={c.id} onClick={()=>setSel(c)} style={{aspectRatio:"2.5/3.5",borderRadius:12,overflow:"hidden",cursor:"pointer",boxShadow:t.sh}}>
                {c.image?<img src={c.image} alt={c.player} style={{width:"100%",height:"100%",objectFit:"cover"}}/>:<CardArt card={c} sm/>}
              </div>
            ))}
          </div>
        </div>}

        {/* User strip */}
        <Card t={t} sx={{marginTop:20,padding:"12px 14px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <div style={{display:"flex",alignItems:"center",gap:10}}>
            <Av name={user.name}/>
            <div>
              <div style={{fontSize:13,fontWeight:800,color:t.tx}}>{user.name}</div>
              <div style={{color:t.tx3,fontSize:11}}>{user.email}{userIsAdmin&&<span style={{marginLeft:6,background:t.accBg,color:t.acc,padding:"1px 6px",borderRadius:6,fontSize:10,fontWeight:700}}>{isSuper(user)?"Super":"Admin"}</span>}</div>
            </div>
          </div>
          <Btn t={t} v="ghost" sz="sm" onClick={onLogout}>Sign Out</Btn>
        </Card>
      </div>}

      {/* ═════ COLLECTION ═════ */}
      {view==="collection"&&<div style={{paddingBottom:90}}>
        {folders.length>0&&<div style={{padding:"12px 16px 0",display:"flex",gap:6,overflowX:"auto"}}>
          <button onClick={()=>setAF(null)} style={{padding:"5px 14px",borderRadius:20,border:"1.5px solid "+(aF===null?t.acc:t.bord),background:aF===null?t.accBg:"transparent",color:aF===null?t.acc:t.tx3,fontSize:12,cursor:"pointer",fontWeight:600,whiteSpace:"nowrap"}}>All</button>
          {folders.map(f=>(
            <button key={f.name} onClick={()=>setAF(f.name===aF?null:f.name)} style={{padding:"5px 14px",borderRadius:20,border:"1.5px solid "+(aF===f.name?t.acc:t.bord),background:aF===f.name?t.accBg:"transparent",color:aF===f.name?t.acc:t.tx3,fontSize:12,cursor:"pointer",fontWeight:600,whiteSpace:"nowrap",display:"flex",alignItems:"center",gap:5}}>
              {f.cover&&<img src={f.cover} alt="" style={{width:14,height:14,borderRadius:3,objectFit:"cover"}}/>}{f.name} ({cards.filter(c=>c.folder===f.name).length})
            </button>
          ))}
        </div>}
        <div style={{padding:"10px 16px",display:"flex",flexWrap:"wrap",gap:8}}>
          <input placeholder="Search cards…" value={search} onChange={e=>setSearch(e.target.value)}
            style={{flex:"1 1 160px",padding:"9px 14px",borderRadius:11,border:"1.5px solid "+t.bord,background:t.inp,color:t.tx,fontSize:13,outline:"none",fontFamily:"inherit"}}
            onFocus={e=>e.target.style.borderColor=t.acc} onBlur={e=>e.target.style.borderColor=t.bord}/>
          {[["sport",SPORTS,filters.sport],["type",CTYPES,filters.type],["par",["All Parallels",...PARS],filters.par],["cond",CONDS,filters.cond],["brand",BRANDS,filters.brand]].map(([k,opts,val])=>(
            <select key={k} value={val} onChange={e=>setFilters(f=>({...f,[k]:e.target.value}))}
              style={{padding:"9px 12px",borderRadius:11,border:"1.5px solid "+t.bord,background:t.inp,color:val.startsWith("All")?t.tx3:t.tx,fontSize:12,cursor:"pointer",outline:"none",appearance:"none",fontFamily:"inherit"}}>
              {opts.map(o=><option key={o} value={o}>{o}</option>)}
            </select>
          ))}
          <select value={sort} onChange={e=>setSort(e.target.value)} style={{padding:"9px 12px",borderRadius:11,border:"1.5px solid "+t.bord,background:t.inp,color:t.tx2,fontSize:12,cursor:"pointer",outline:"none",appearance:"none",fontFamily:"inherit"}}>
            <option value="newest">Newest</option><option value="value_hi">Value ↓</option><option value="value_lo">Value ↑</option><option value="alpha">A–Z</option><option value="year_new">Year ↓</option>
          </select>
        </div>
        <div style={{padding:"0 16px 10px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <div style={{color:t.tx3,fontSize:12,fontWeight:600}}>{filtered.length} card{filtered.length!==1?"s":""}</div>
          <div style={{display:"flex",gap:7}}>
            {selMode&&selIds.size>0&&<>
              <select onChange={e=>{if(e.target.value){mvSel(e.target.value==="__none__"?null:e.target.value);}e.target.value="";}} style={{padding:"6px 10px",borderRadius:9,border:"1px solid "+t.bord,background:t.inp,color:t.tx,fontSize:12,outline:"none",appearance:"none"}}>
                <option value="">Move to…</option><option value="__none__">No folder</option>
                {folders.map(f=><option key={f.name} value={f.name}>{f.name}</option>)}
              </select>
              <Btn t={t} v="red" sz="sm" onClick={dlSel}>Delete ({selIds.size})</Btn>
            </>}
            <Btn t={t} v={selMode?"soft":"ghost"} sz="sm" onClick={()=>{setSelMode(s=>!s);setSelIds(new Set());}}>{selMode?"Done":"Select"}</Btn>
            <button onClick={()=>setListMode(m=>!m)} style={{background:t.surf2,border:"1px solid "+t.bord,color:t.tx2,borderRadius:9,padding:"6px 10px",cursor:"pointer",fontSize:14}}>{listMode?"⊞":"☰"}</button>
          </div>
        </div>
        {!listMode&&<div style={{padding:"0 16px",display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(115px,1fr))",gap:10}}>
          {filtered.map(c=><CardTile key={c.id} card={c} onClick={x=>!selMode&&setSel(x)} selMode={selMode} selSet={setSelIds} selIds={selIds} t={t}/>)}
          <div onClick={()=>setScanning(true)} style={{aspectRatio:"2.5/3.5",borderRadius:14,border:"2px dashed "+t.bord,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",cursor:"pointer",transition:"border-color .15s"}}
            onMouseEnter={e=>e.currentTarget.style.borderColor=t.acc} onMouseLeave={e=>e.currentTarget.style.borderColor=t.bord}>
            <div style={{fontSize:24,color:t.tx3}}>+</div><div style={{color:t.tx3,fontSize:11,fontWeight:600,marginTop:4}}>Add Card</div>
          </div>
        </div>}
        {listMode&&<div style={{padding:"0 16px",display:"flex",flexDirection:"column",gap:6}}>
          {filtered.map(c=>{const isP=c.parallel&&c.parallel!=="Base";return(
            <Card key={c.id} t={t} sx={{padding:"10px 14px",display:"flex",alignItems:"center",gap:10,cursor:"pointer",border:isP?"1px solid "+t.gold+"30":"1px solid "+t.bord}} onClick={()=>setSel(c)}>
              <div style={{width:38,height:53,borderRadius:9,overflow:"hidden",flexShrink:0}}>{c.image?<img src={c.image} alt={c.player} style={{width:"100%",height:"100%",objectFit:"cover"}}/>:<CardArt card={c} sm/>}</div>

                {c.graded&&<div style={{color:t.grn,fontSize:10,fontWeight:700}}>{c.grade}</div>}

      {/* ═════ STATS ═════ */}
      {view==="stats"&&<div style={{padding:"16px 16px 90px"}}>
        <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:8,marginBottom:14}}>
          {[["Cards",cards.length,t.acc],["Value",tv(cards)>0?fmt(tv(cards)):"$0",t.gold],["Rookies",cards.filter(c=>c.type==="Rookie").length,t.grn],["Graded",cards.filter(c=>c.graded).length,"#A78BFA"],["Serialed",cards.filter(c=>c.serialed).length,t.acc],["Parallels",cards.filter(c=>c.parallel&&c.parallel!=="Base").length,t.gold]].map(([l,v,clr])=>(
            <Card key={l} t={t} sx={{padding:12,textAlign:"center"}}><div style={{fontSize:20,fontWeight:900,color:clr}}>{v}</div><div style={{color:t.tx3,fontSize:10,fontWeight:700,marginTop:2}}>{l.toUpperCase()}</div></Card>
          ))}
        </div>
        {[...cards].sort((a,b)=>(b.ebayAvg||0)-(a.ebayAvg||0)).slice(0,5).length>0&&(
          <Card t={t} sx={{padding:16,marginBottom:12}}>
            <div style={{fontSize:12,fontWeight:800,color:t.tx3,letterSpacing:.5,marginBottom:12}}>👑 TOP 5 BY VALUE</div>
            {[...cards].sort((a,b)=>(b.ebayAvg||0)-(a.ebayAvg||0)).slice(0,5).map((c,i)=>(
              <div key={c.id} onClick={()=>setSel(c)} style={{display:"flex",alignItems:"center",gap:10,padding:"8px 0",borderTop:i>0?"1px solid "+t.bord:"none",cursor:"pointer"}}>
                <div style={{width:22,textAlign:"center",fontSize:14,fontWeight:900,color:i===0?t.gold:t.tx3}}>{i+1}</div>
                <div style={{width:32,height:44,borderRadius:7,overflow:"hidden",flexShrink:0}}>{c.image?<img src={c.image} alt={c.player} style={{width:"100%",height:"100%",objectFit:"cover"}}/>:<CardArt card={c} sm/>}</div>
                <div style={{flex:1,minWidth:0}}>

                  <div style={{color:t.tx3,fontSize:11}}>{c.year} {c.brand}{c.parallel&&c.parallel!=="Base"?" · "+c.parallel:""}</div>
                </div>

        {board.length>=2&&(

              const isMe=u.id===user.id;
              const bgClrs=[t.gold,"#9CA3AF","#CD7F32"];
              return(
                <div key={u.id} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:7,maxWidth:120}}>
                  <Av name={u.name} size={rank===0?48:38}/>
                  <div style={{fontSize:12,fontWeight:700,color:isMe?t.acc:t.tx,textAlign:"center",width:"100%",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{isMe?"You":u.name}</div>
                  <div style={{width:"100%",height:hs[idx],background:bgClrs[rank],borderRadius:"12px 12px 0 0",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:4,boxShadow:"0 4px 16px "+bgClrs[rank]+"60"}}>
                    <div style={{fontSize:rank===0?28:22}}>{["🥇","🥈","🥉"][rank]}</div>
                    <div style={{color:"#fff",fontSize:12,fontWeight:900}}>{fmt(u.total)}</div>

      {/* ── MODALS ── */}
      {scanning&&<ScanModal onClose={()=>setScanning(false)} onAdd={addCard} folders={folders} t={t}/>}

      {showF&&<FolderModal folders={folders} cards={cards} onClose={()=>setShowF(false)} onCreate={mkF} onDelete={rmF} onRename={rnF} onCover={cvF} t={t}/>}
      {showWl&&<WishlistModal wl={wl} onClose={()=>setShowWl(false)} onAdd={w=>setWl(l=>[w,...l])} onDel={id=>setWl(l=>l.filter(w=>w.id!==id))} t={t}/>}
      {showTour&&<TourModal t={t} onDone={()=>setShowTour(false)}/>}

    </div>
  );
}

/* ═══════════════════════════════════════════════════════════
   CHATBOT
═══════════════════════════════════════════════════════════ */
function ChatBot({t,user}){
  const[open,setOpen]=useState(false);
  const[msgs,setMsgs]=useState([{role:"assistant",content:"Hey! I'm your Card Vault assistant 🃏 Ask me anything about sports cards — grading, values, parallels, rookies, investing, or how to use the app!"}]);
  const[input,setInput]=useState("");
  const[loading,setLoading]=useState(false);
  const[unread,setUnread]=useState(0);
  const bottomRef=useRef();
  const inputRef=useRef();

  useEffect(()=>{
    if(open){
      setUnread(0);
      setTimeout(()=>bottomRef.current?.scrollIntoView({behavior:"smooth"}),80);
      setTimeout(()=>inputRef.current?.focus(),120);
    }
  },[open,msgs]);

  const send=async()=>{
    const text=input.trim();
    if(!text||loading)return;
    setInput("");
    const newMsgs=[...msgs,{role:"user",content:text}];
    setMsgs(newMsgs);
    setLoading(true);
    try{
      const resp=await fetch("/api/chat",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({messages:newMsgs.slice(-10).map(m=>({role:m.role,content:m.content}))})
      });
      const data=await resp.json();
      const reply=data.reply||data.error||"Sorry, I couldn't respond. Try again.";
      setMsgs(p=>[...p,{role:"assistant",content:reply}]);
      if(!open)setUnread(u=>u+1);
    }catch(e){
      setMsgs(p=>[...p,{role:"assistant",content:"Connection error — check your internet and try again."}]);
    }
    setLoading(false);
  };

  const SUGGESTIONS=["What makes a card valuable?","How do I grade a card?","What's a Prizm refractor?","Best rookie cards to collect?","How to spot a fake card?"];

  return(
    <>
      {/* Floating button */}
      <button onClick={()=>setOpen(o=>!o)} style={{position:"fixed",bottom:90,right:16,zIndex:7000,width:54,height:54,borderRadius:27,background:open?t.surf3:t.gradBtn,border:open?"2px solid "+t.bord:"none",boxShadow:open?t.sh:"0 6px 24px rgba(108,61,251,.5)",cursor:"pointer",display:"flex",alignItems:"center",justifyContent:"center",fontSize:22,transition:"all .2s",flexShrink:0}}>
        {open?"✕":"💬"}
        {!open&&unread>0&&<div style={{position:"absolute",top:-2,right:-2,background:t.red,borderRadius:"50%",width:18,height:18,display:"flex",alignItems:"center",justifyContent:"center",fontSize:10,color:"#fff",fontWeight:800}}>{unread}</div>}
      </button>

      {/* Chat panel */}
      {open&&(
        <div style={{position:"fixed",bottom:156,right:16,zIndex:7000,width:Math.min(360,window.innerWidth-32),height:480,background:t.surf,borderRadius:22,boxShadow:t.shHov,border:"1px solid "+t.bord,display:"flex",flexDirection:"column",overflow:"hidden",animation:"slideUp .25s ease"}}>

          {/* Header */}
          <div style={{background:t.gradBtn,padding:"14px 16px",display:"flex",alignItems:"center",gap:10,flexShrink:0}}>
            <div style={{width:36,height:36,borderRadius:18,background:"rgba(255,255,255,.2)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:18,flexShrink:0}}>🃏</div>
            <div style={{flex:1}}>
              <div style={{color:"#fff",fontWeight:800,fontSize:15,lineHeight:1}}>Card Vault AI</div>
              <div style={{color:"rgba(255,255,255,.7)",fontSize:11,marginTop:2}}>{loading?"Thinking...":"Your card collecting expert"}</div>
            </div>
            <button onClick={()=>setOpen(false)} style={{background:"rgba(255,255,255,.15)",border:"none",color:"#fff",width:28,height:28,borderRadius:14,cursor:"pointer",fontSize:15,display:"flex",alignItems:"center",justifyContent:"center"}}>✕</button>
          </div>

          {/* Messages */}
          <div style={{flex:1,overflowY:"auto",padding:"14px 14px 8px",display:"flex",flexDirection:"column",gap:10}}>
            {msgs.map((m,i)=>(
              <div key={i} style={{display:"flex",flexDirection:m.role==="user"?"row-reverse":"row",gap:8,alignItems:"flex-end"}}>
                {m.role==="assistant"&&<div style={{width:26,height:26,borderRadius:13,background:t.gradBtn,display:"flex",alignItems:"center",justifyContent:"center",fontSize:12,flexShrink:0,marginBottom:2}}>🃏</div>}
                <div style={{maxWidth:"82%",padding:"10px 13px",borderRadius:m.role==="user"?"18px 18px 4px 18px":"18px 18px 18px 4px",background:m.role==="user"?t.gradBtn:t.surf2,color:m.role==="user"?"#fff":t.tx,fontSize:13,lineHeight:1.55,wordBreak:"break-word",boxShadow:t.sh}}>
                  {m.content.split("\n").map((line,li)=>(
                    <span key={li}>{line}{li<m.content.split("\n").length-1&&<br/>}</span>
                  ))}
                </div>
              </div>
            ))}
            {loading&&(
              <div style={{display:"flex",gap:8,alignItems:"flex-end"}}>
                <div style={{width:26,height:26,borderRadius:13,background:t.gradBtn,display:"flex",alignItems:"center",justifyContent:"center",fontSize:12,flexShrink:0}}>🃏</div>
                <div style={{padding:"10px 14px",borderRadius:"18px 18px 18px 4px",background:t.surf2}}>
                  <div style={{display:"flex",gap:5}}>
                    {[0,1,2].map(i=>{const a="pulse 1.2s "+(i*0.4)+"s infinite";return <div key={i} style={{width:7,height:7,borderRadius:"50%",background:t.acc,animation:a}}/>;})}</div>
                </div>
              </div>
            )}
            <div ref={bottomRef}/>
          </div>

          {/* Quick suggestions (first message only) */}
          {msgs.length<=1&&(
            <div style={{padding:"0 10px 8px",display:"flex",gap:6,flexWrap:"wrap"}}>
              {SUGGESTIONS.map(s=>(
                <button key={s} onClick={()=>{setInput(s);setTimeout(()=>inputRef.current?.focus(),50);}} style={{padding:"5px 10px",borderRadius:20,background:t.accBg,border:"1px solid "+t.acc+"30",color:t.acc,fontSize:11,fontWeight:600,cursor:"pointer"}}>
                  {s}
                </button>
              ))}
            </div>
          )}

          {/* Input */}
          <div style={{padding:"10px 12px 12px",borderTop:"1px solid "+t.bord,display:"flex",gap:8,alignItems:"flex-end",flexShrink:0}}>
            <textarea
              ref={inputRef}
              value={input}
              onChange={e=>setInput(e.target.value)}
              onKeyDown={e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send();}}}
              placeholder="Ask about cards, values, grading..."
              rows={1}
              style={{flex:1,padding:"9px 12px",borderRadius:12,border:"1.5px solid "+t.bord,background:t.inp,color:t.tx,fontSize:13,outline:"none",resize:"none",fontFamily:"inherit",lineHeight:1.4,maxHeight:80,overflowY:"auto"}}
              onFocus={e=>e.target.style.borderColor=t.acc}
              onBlur={e=>e.target.style.borderColor=t.bord}
              onInput={e=>{e.target.style.height="auto";e.target.style.height=Math.min(e.target.scrollHeight,80)+"px";}}
            />
            <button onClick={send} disabled={!input.trim()||loading}
              style={{width:38,height:38,borderRadius:19,background:input.trim()&&!loading?t.gradBtn:t.surf3,border:"none",color:input.trim()&&!loading?"#fff":t.tx3,cursor:input.trim()&&!loading?"pointer":"default",display:"flex",alignItems:"center",justifyContent:"center",fontSize:16,flexShrink:0,transition:"all .15s",boxShadow:input.trim()&&!loading?"0 4px 12px rgba(108,61,251,.4)":"none"}}>
              ➤
            </button>
          </div>
        </div>
      )}
    </>
  );
}

/* ═══════════════════════════════════════════════════════════
   ROOT
═══════════════════════════════════════════════════════════ */
function App(){
  const[users,setUsersRaw]=useState(()=>initUsers());
  const[me,setMeRaw]=useState(()=>{const u=initUsers();return initMe(u);});
  const[notifs,setNotifsRaw]=useState(()=>initNotifs());
  const[globalPrices,setGlobalPricesRaw]=useState(()=>initPrices());
  const[adminReqs,setAdminReqsRaw]=useState(()=>initAdminReqs());
  const[theme,setTheme]=useState(()=>{const u=initUsers();const m=initMe(u);return m?.settings?.darkMode?DK:LT;});
  const[tour,setTour]=useState(false);

  const setUsers=fn=>{setUsersRaw(p=>{const next=typeof fn==="function"?fn(p):fn;saveUsers(next);return next;});};
  const setMe=u=>{setMeRaw(u);saveMe(u);};
  const setNotifs=fn=>{setNotifsRaw(p=>{const next=typeof fn==="function"?fn(p):fn;saveNotifs(next);return next;});};

  const updUser=u=>{
    setUsersRaw(p=>{const next=p.map(x=>x.id===u.id?u:x);saveUsers(next);return next;});
    setMeRaw(m=>{if(m?.id===u.id){saveMe(u);return u;}return m;});
  };

  // Admin sets a price — propagate to ALL user cards with matching key
  const setPrice=(card,low,avg)=>{
    const k=priceKey(card);
    setGlobalPricesRaw(p=>{const next={...p,[k]:{low,avg}};savePrices(next);return next;});
    // Update every user's matching cards
    setUsersRaw(p=>{
      const next=p.map(u=>({...u,cards:(u.cards||[]).map(c=>priceKey(c)===k?{...c,ebayLow:low,ebayAvg:avg}:c)}));
      saveUsers(next);return next;
    });
    setMeRaw(m=>{if(!m)return m;const next={...m,cards:(m.cards||[]).map(c=>priceKey(c)===k?{...c,ebayLow:low,ebayAvg:avg}:c)};saveMe(next);return next;});
  };

  const login=u=>{setMe(u);setTheme(u.settings?.darkMode?DK:LT);};
  const logout=()=>{setMe(null);setTheme(LT);};
  const register=async u=>{
    setUsersRaw(p=>{const next=[...p,u];saveUsers(next);return next;});
    // Apply existing global prices to new user's future cards
    setMe(u);setTheme(LT);setTour(true);
    try{await navigator.mediaDevices?.getUserMedia({video:true,audio:false}).then(s=>s.getTracks().forEach(x=>x.stop()));}catch{}
    if("Notification" in window&&Notification.permission==="default"){try{await Notification.requestPermission();}catch{}}
  };
  const handleForgot=u=>{const pw=gpw();setNotifs(n=>[{id:uid(),type:"pw",userEmail:u.email,userName:u.name,recovery:u.recovery||u.email,recoveryType:u.recoveryType||"email",tempPass:pw,time:now(),read:false,sent:false},...n]);};
  const handleQuestion=(q,uName,uEmail)=>{setNotifs(n=>[{id:uid(),type:"question",userName:uName,userEmail:uEmail,question:q,time:now(),read:false,answered:false,answer:""},...n]);};
  const sendRec=id=>setNotifs(n=>n.map(x=>x.id===id?{...x,sent:true,read:true}:x));
  const answerQ=(id,ans)=>setNotifs(n=>n.map(x=>x.id===id?{...x,answered:true,read:true,answer:ans}:x));
  const dismiss=id=>setNotifs(n=>n.filter(x=>x.id!==id));

  // Admin requests (sub-admin wants to promote someone)
  const approveAdmin=id=>{
    const req=adminReqs.find(r=>r.id===id);if(!req)return;
    const u=users.find(x=>x.id===req.targetId);if(u)updUser({...u,role:"admin",adminApproved:true});
    setAdminReqsRaw(p=>{const next=p.map(r=>r.id===id?{...r,status:"approved"}:r);saveAdminReqs(next);return next;});
  };
  const rejectAdmin=id=>{
    setAdminReqsRaw(p=>{const next=p.map(r=>r.id===id?{...r,status:"rejected"}:r);saveAdminReqs(next);return next;});
  };

  const t=theme;

  return(
    <>
      <style>{`
        @keyframes shim{0%{background-position:200% 0}100%{background-position:-200% 0}}
        @keyframes pulse{0%,100%{opacity:.2;transform:scale(.8)}50%{opacity:1;transform:scale(1)}}
        @keyframes slideUp{from{transform:translateY(100%);opacity:0}to{transform:translateY(0);opacity:1}}
        *{box-sizing:border-box;margin:0;padding:0}
        html,body{background:${t.bg};color-scheme:${t.dark?"dark":"light"}}
        ::-webkit-scrollbar{width:4px}::-webkit-scrollbar-thumb{background:${t.bord};border-radius:2px}
        select,input,textarea{color-scheme:${t.dark?"dark":"light"};font-family:inherit}
        @media(prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;transition-duration:.01ms !important}}
      `}</style>

      {tour&&me&&<TourModal t={t} onDone={()=>setTour(false)}/>}

      {!me&&<AuthScreen users={users} onLogin={login} onReg={register} onForgot={handleForgot} t={t}/>}

      {me&&<Vault
        user={me} allUsers={users} onUpdUser={updUser} onLogout={logout}
        onGoAdmin={()=>{}} notifs={notifs} theme={theme} setTheme={setTheme}
        onQuestion={handleQuestion} globalPrices={globalPrices} onSetPrice={setPrice}
        adminReqs={adminReqs} onApproveAdmin={approveAdmin} onRejectAdmin={rejectAdmin}
        onAnswer={answerQ} onSend={sendRec} onDismiss={dismiss}
      />}
    </>
  );
}
</script>

  <!-- Bootstrap: runs AFTER all above elements exist in DOM -->
  <script>
  (function() {
    function showErr(msg, stack) {
      var d = document.getElementById('errdiv');
      d.style.display = 'block';
      d.textContent = msg + (stack ? '\n\n' + stack : '');
      document.getElementById('loader').style.display = 'none';
    }

    try {
      document.getElementById('lstatus').textContent = 'Compiling app...';

      // Expose React hooks as globals so the JSX source can use them directly
      var useState    = React.useState;
      var useRef      = React.useRef;
      var useEffect   = React.useEffect;
      var useCallback = React.useCallback;
      var useMemo     = React.useMemo;

      // Read JSX source from the text/plain tag
      var srcEl = document.getElementById('appsrc');
      if (!srcEl) { showErr('Source element not found'); return; }
      var jsxCode = srcEl.textContent;

      // Compile JSX → JS using Babel
      var result = Babel.transform(jsxCode, {
        presets: [['react', { runtime: 'classic', pragma: 'React.createElement', pragmaFrag: 'React.Fragment' }]],
        plugins: [],
        filename: 'app.jsx'
      });

      document.getElementById('lstatus').textContent = 'Starting app...';

      // Execute compiled code, capture the App function
      // We inject the hook variables into scope via a wrapper function
      var execFn = new Function(
        'useState','useRef','useEffect','useCallback','useMemo',
        result.code + '\nreturn App;'
      );
      var AppComponent = execFn(useState, useRef, useEffect, useCallback, useMemo);

      // Mount React
      var rootEl = document.getElementById('root');
      var reactRoot = ReactDOM.createRoot(rootEl);
      reactRoot.render(React.createElement(AppComponent));

      // Hide loader
      document.getElementById('loader').style.display = 'none';

    } catch(e) {
      showErr('Error: ' + e.message, e.stack);
    }
  })();
  </script>

</body>
</html>
