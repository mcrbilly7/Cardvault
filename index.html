/* ─── MAIN VAULT ─────────────────────────────────────────────────────────── */
function Vault({user,allUsers,onUpdUser,onLogout,onGoAdmin,notifs,theme,setTheme,onQuestion}){
  const t=theme;
  const[cards,setCards]=useState(user.cards||[]);
  const[folders,setFolders]=useState(user.folders||[]);
  const[wl,setWl]=useState(user.wishlist||[]);
  const[settings,setSettings]=useState({...DS,...user.settings});
  const[view,setView]=useState("home");
  const[aF,setAF]=useState(null);
  const[scanning,setScanning]=useState(false);
  const[sel,setSel]=useState(null);
  const[showF,setShowF]=useState(false);
  const[showWl,setShowWl]=useState(false);
  const[search,setSearch]=useState("");
  const[filters,setFilters]=useState({sport:"All Sports",type:"All Types",cond:"All Conditions",brand:"All Brands",par:"All Parallels"});
  const[sort,setSort]=useState(settings.sortDefault||"newest");
  const[listMode,setListMode]=useState(false);
  const[selMode,setSelMode]=useState(false);
  const[selIds,setSelIds]=useState(new Set());
  const[showTour,setShowTour]=useState(false);

  // Sync to parent (debounce-safe: only when data actually changes)
  const syncRef=useRef(false);
  useEffect(()=>{
    if(!syncRef.current){syncRef.current=true;return;}
    onUpdUser({...user,cards,folders,wishlist:wl,settings});
  },[cards,folders,wl,settings]);

  const addCard=c=>setCards(p=>[c,...p]);
  const updCard=u=>{ setCards(p=>p.map(c=>c.id===u.id?u:c)); setSel(u); };
  const delCard=id=>{ setCards(p=>p.filter(c=>c.id!==id)); setSel(null); };
  const mkF=n=>{ if(!folders.find(f=>f.name===n))setFolders(f=>[...f,{name:n,cover:null}]); };
  const rmF=n=>{ setFolders(f=>f.filter(x=>x.name!==n)); setCards(p=>p.map(c=>c.folder===n?{...c,folder:null}:c)); };
  const rnF=(o,n)=>{ setFolders(f=>f.map(x=>x.name===o?{...x,name:n}:x)); setCards(p=>p.map(c=>c.folder===o?{...c,folder:n}:c)); };
  const cvF=(name,url)=>setFolders(f=>f.map(x=>x.name===name?{...x,cover:url}:x));
  const mvSel=folder=>{ setCards(p=>p.map(c=>selIds.has(c.id)?{...c,folder}:c)); setSelIds(new Set()); setSelMode(false); };
  const dlSel=()=>{ if(window.confirm(`Delete ${selIds.size} card${selIds.size!==1?"s":""}?`)){setCards(p=>p.filter(c=>!selIds.has(c.id)));setSelIds(new Set());setSelMode(false);} };

  const exportCSV=()=>{
    const H=["Player","Sport","Year","Brand","Type","Parallel","Team","Condition","Graded","Grade","Serialed","Serial#","Folder","Est Low","Est Avg","Notes"];
    const R=cards.map(c=>[c.player,c.sport,c.year,c.brand,c.type,c.parallel||"Base",c.team,c.condition,c.graded?"Yes":"No",c.grade||"",c.serialed?"Yes":"No",c.serialNum||"",c.folder||"",c.ebayLow||"",c.ebayAvg||"",c.notes||""]);
    const csv=[H,...R].map(r=>r.map(v=>`"${String(v||"").replace(/"/g,'""')}"`).join(",")).join("\n");
    const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download="card-vault.csv";a.click();
  };

  const filtered=cards.filter(c=>{
    if(aF&&c.folder!==aF)return false;
    const q=search.toLowerCase();
    return(!q||[c.player,c.team,c.year,c.brand,c.notes].some(x=>x?.toLowerCase().includes(q)))
      &&(filters.sport==="All Sports"||c.sport===filters.sport)
      &&(filters.type==="All Types"||c.type===filters.type)
      &&(filters.cond==="All Conditions"||c.condition===filters.cond)
      &&(filters.brand==="All Brands"||c.brand===filters.brand)
      &&(filters.par==="All Parallels"||(c.parallel||"Base")===filters.par);
  }).sort((a,b)=>{
    if(sort==="newest")return b.id>a.id?1:-1;
    if(sort==="value_hi")return(b.ebayAvg||0)-(a.ebayAvg||0);
    if(sort==="value_lo")return(a.ebayAvg||0)-(b.ebayAvg||0);
    if(sort==="alpha")return(a.player||"").localeCompare(b.player||"");
    if(sort==="year_new")return(b.year||0)-(a.year||0);
    return 0;
  });

  // Leaderboard — ONLY real registered users (no admin, no seed/demo)
  const board=allUsers.map(u=>u.id===user.id?{...u,cards,settings}:u)
    .filter(u=>u.role!=="admin"&&u.settings?.shareCollection!==false&&tv(u.cards||[])>0)
    .map(u=>({...u,total:tv(u.cards||[])}))
    .sort((a,b)=>b.total-a.total);
  const boardMax=board.length?board[0].total:1;
  const medals=["🥇","🥈","🥉"];

  const best=top(cards);
  const unread=notifs.filter(n=>!n.read).length;

  const NAV=[
    {id:"home",label:"Home",icon:<svg width={20} height={20} viewBox="0 0 20 20" fill="none"><path d="M3 9.5L10 3l7 6.5V17a1 1 0 01-1 1H4a1 1 0 01-1-1V9.5z" stroke="currentColor" strokeWidth="1.6"/><rect x="7.5" y="12" width="5" height="6" rx=".5" stroke="currentColor" strokeWidth="1.4"/></svg>},
    {id:"collection",label:"Collection",icon:<svg width={20} height={20} viewBox="0 0 20 20" fill="none"><rect x="2" y="3" width="11" height="15" rx="2" stroke="currentColor" strokeWidth="1.6"/><rect x="5" y="1" width="11" height="15" rx="2" stroke="currentColor" strokeWidth="1.4"/><rect x="8" y="4" width="6" height="4" rx="1" stroke="currentColor" strokeWidth="1.2"/></svg>},
    {id:"stats",label:"Stats",icon:<svg width={20} height={20} viewBox="0 0 20 20" fill="none"><rect x="2" y="12" width="4" height="6" rx="1" fill="currentColor" opacity=".5"/><rect x="8" y="8" width="4" height="10" rx="1" fill="currentColor" opacity=".7"/><rect x="14" y="4" width="4" height="14" rx="1" fill="currentColor"/></svg>},
    {id:"leaderboard",label:"Ranks",icon:<svg width={20} height={20} viewBox="0 0 20 20" fill="none"><path d="M10 2l2 5h5l-4 3 1.5 5L10 12l-4.5 3L7 10 3 7h5L10 2z" stroke="currentColor" strokeWidth="1.5" strokeLinejoin="round"/></svg>},
    {id:"help",label:"Help",icon:<svg width={20} height={20} viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="8" stroke="currentColor" strokeWidth="1.6"/><path d="M7.5 7.5a2.5 2.5 0 015 0c0 1.5-2.5 2-2.5 4" stroke="currentColor" strokeWidth="1.6" strokeLinecap="round"/><circle cx="10" cy="15" r=".8" fill="currentColor"/></svg>},
  ];

  return(
    <div style={{minHeight:"100vh",background:t.bg,maxWidth:900,margin:"0 auto",fontFamily:"-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"}}>

      {/* HEADER */}
      <div style={{background:t.nav,borderBottom:`1px solid ${t.bord}`,padding:"12px 16px",display:"flex",alignItems:"center",justifyContent:"space-between",position:"sticky",top:0,zIndex:200}}>
        <div onClick={()=>{setView("home");setAF(null);}} style={{cursor:"pointer",display:"flex",alignItems:"center",gap:8}}>
          <Logo size={28} color={t.acc}/>
          <div>
            <div style={{fontSize:16,fontWeight:800,color:t.tx,letterSpacing:-.3}}>Card Vault</div>
            <div style={{color:t.tx3,fontSize:10,fontWeight:600}}>{cards.length} cards · {fmt(tv(cards))}</div>
          </div>
        </div>
        <div style={{display:"flex",gap:6,alignItems:"center"}}>
          {user.role==="admin"&&<button onClick={onGoAdmin} style={{position:"relative",background:t.redBg,border:`1px solid ${t.red}40`,color:t.red,borderRadius:9,padding:"7px 10px",cursor:"pointer",fontSize:13,fontWeight:800}}>
            ⚡{unread>0&&<span style={{position:"absolute",top:-4,right:-4,background:t.red,borderRadius:"50%",width:14,height:14,display:"flex",alignItems:"center",justifyContent:"center",fontSize:9,color:"#fff",fontWeight:800}}>{unread}</span>}
          </button>}
          <button onClick={()=>setShowWl(true)} style={{background:t.surf2,border:`1px solid ${t.bord}`,color:t.tx2,borderRadius:9,padding:"7px 10px",cursor:"pointer",fontSize:14}}>★</button>
          <button onClick={()=>setShowF(true)} style={{background:t.surf2,border:`1px solid ${t.bord}`,color:t.tx2,borderRadius:9,padding:"7px 10px",cursor:"pointer",fontSize:13}}>📁</button>
          <button onClick={exportCSV} style={{background:t.surf2,border:`1px solid ${t.bord}`,color:t.tx2,borderRadius:9,padding:"7px 10px",cursor:"pointer",fontSize:13}}>↓</button>
          <button onClick={()=>setView("settings")} style={{background:t.surf2,border:`1px solid ${t.bord}`,color:t.tx2,borderRadius:9,padding:"7px 10px",cursor:"pointer",fontSize:14}}>⚙</button>
          <Btn t={t} v="fill" sz="sm" onClick={()=>setScanning(true)}>+ Scan</Btn>
        </div>
      </div>

      {/* BOTTOM NAV */}
      <div style={{position:"fixed",bottom:0,left:"50%",transform:"translateX(-50%)",width:"100%",maxWidth:900,background:t.nav,borderTop:`1px solid ${t.bord}`,display:"flex",zIndex:200}}>
        {NAV.map(n=>(
          <button key={n.id} onClick={()=>{setView(n.id);if(n.id!=="collection")setAF(null);}}
            style={{flex:1,padding:"10px 4px 8px",background:"none",border:"none",cursor:"pointer",color:view===n.id?t.acc:t.tx3,display:"flex",flexDirection:"column",alignItems:"center",gap:3,transition:"color .15s"}}>
            {n.icon}
            <span style={{fontSize:10,fontWeight:700}}>{n.label}</span>
          </button>
        ))}
      </div>

      {/* ── HOME ── */}
      {view==="home"&&(
        <div style={{padding:"16px 16px 80px"}}>
          {best?(
            <Surf t={t} p={0} r={16} style={{marginBottom:16,overflow:"hidden",cursor:"pointer"}} onClick={()=>setSel(best)}>
              <div style={{background:`linear-gradient(135deg,${best.color}18,transparent)`,padding:16,display:"flex",gap:14,alignItems:"center",position:"relative"}}>
                <div style={{position:"absolute",top:-16,right:-16,width:100,height:100,borderRadius:"50%",background:`${best.color}12`,filter:"blur(28px)"}}/>
                <div style={{width:78,height:109,borderRadius:10,overflow:"hidden",flexShrink:0,boxShadow:`0 6px 20px ${best.color}40`,border:best.parallel&&best.parallel!=="Base"?`2px solid ${t.gold}`:`1px solid ${t.bord}`}}>
                  {best.image?<img src={best.image} alt={best.player} style={{width:"100%",height:"100%",objectFit:"cover"}}/>:<CardArt card={best}/>}
                </div>
                <div style={{flex:1,position:"relative"}}>
                  <div style={{fontSize:10,fontWeight:800,color:t.gold,letterSpacing:.5,marginBottom:3}}>👑 HIGHEST VALUED</div>
                  <div style={{fontSize:20,fontWeight:900,color:t.tx,lineHeight:1.15,marginBottom:4}}>{best.player}</div>
                  <div style={{color:t.tx3,fontSize:12,marginBottom:8}}>{best.year} {best.brand}{best.parallel&&best.parallel!=="Base"?` · ${best.parallel}`:""}</div>
                  {best.ebayAvg&&<div style={{display:"inline-flex",alignItems:"baseline",gap:4,background:t.goldBg,borderRadius:8,padding:"4px 10px"}}>
                    <span style={{fontSize:19,fontWeight:900,color:t.gold}}>{fmt(best.ebayAvg)}</span>
                    <span style={{color:t.tx3,fontSize:11,fontWeight:600}}>est.</span>
                  </div>}
                </div>
              </div>
            </Surf>
          ):(
            <Surf t={t} p={28} r={16} style={{marginBottom:16,textAlign:"center",border:`2px dashed ${t.bord}`,background:"transparent",cursor:"pointer"}} onClick={()=>setScanning(true)}>
              <Logo size={40} color={t.acc}/>
              <div style={{fontSize:17,fontWeight:800,color:t.tx,marginTop:10,marginBottom:4}}>Scan your first card</div>
              <div style={{color:t.tx3,fontSize:13}}>Tap to add a card to your vault</div>
            </Surf>
          )}
          <div style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:8,marginBottom:16}}>
            {[["Cards",cards.length,"#007AFF"],["Value",fmt(tv(cards)),"#FF9F0A"],["Rookies",cards.filter(c=>c.type==="Rookie").length,"#34C759"],["Graded",cards.filter(c=>c.graded).length,"#8E8E93"]].map(([l,v,clr])=>(
              <Surf key={l} t={t} p="10px 8px" r={12} style={{textAlign:"center"}}>
                <div style={{fontSize:16,fontWeight:900,color:clr}}>{v}</div>
                <div style={{color:t.tx3,fontSize:10,fontWeight:700,marginTop:2}}>{l.toUpperCase()}</div>
              </Surf>
            ))}
          </div>
          {folders.length>0&&<div style={{marginBottom:16}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
              <div style={{fontSize:13,fontWeight:800,color:t.tx}}>Folders</div>
              <button onClick={()=>setShowF(true)} style={{background:"none",border:"none",color:t.acc,fontSize:13,fontWeight:700,cursor:"pointer"}}>Manage</button>
            </div>
            <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>
              {folders.map(f=>{const fc=cards.filter(c=>c.folder===f.name);return(
                <Surf key={f.name} t={t} p={0} r={12} style={{display:"flex",alignItems:"center",overflow:"hidden",cursor:"pointer",minWidth:140}} onClick={()=>{setView("collection");setAF(f.name);}}>
                  <div style={{width:44,height:44,flexShrink:0,overflow:"hidden",background:t.surf2}}>{f.cover?<img src={f.cover} alt="" style={{width:"100%",height:"100%",objectFit:"cover"}}/>:<div style={{width:"100%",height:"100%",display:"flex",alignItems:"center",justifyContent:"center",fontSize:22}}>📁</div>}</div>
                  <div style={{padding:"6px 12px"}}><div style={{fontSize:13,fontWeight:700,color:t.tx,whiteSpace:"nowrap"}}>{f.name}</div><div style={{color:t.tx3,fontSize:11}}>{fc.length} cards</div></div>
                </Surf>
              );})}
            </div>
          </div>}
          {cards.length>0&&<div>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
              <div style={{fontSize:13,fontWeight:800,color:t.tx}}>Recently Added</div>
              <button onClick={()=>setView("collection")} style={{background:"none",border:"none",color:t.acc,fontSize:13,fontWeight:700,cursor:"pointer"}}>View All</button>
            </div>
            <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(90px,1fr))",gap:8}}>
              {cards.slice(0,10).map(c=>(
                <div key={c.id} onClick={()=>setSel(c)} style={{aspectRatio:"2.5/3.5",borderRadius:10,overflow:"hidden",cursor:"pointer",boxShadow:t.sh}}>
                  {c.image?<img src={c.image} alt={c.player} style={{width:"100%",height:"100%",objectFit:"cover"}}/>:<CardArt card={c} sm/>}
                </div>
              ))}
            </div>
          </div>}
          <Surf t={t} p={12} r={12} style={{marginTop:16,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <div style={{display:"flex",alignItems:"center",gap:10}}>
              <Av name={user.name} size={32} t={t}/>
              <div><div style={{fontSize:13,fontWeight:800,color:t.tx}}>{user.name}</div><div style={{color:t.tx3,fontSize:11}}>{user.email}</div></div>
            </div>
            <Btn t={t} v="ghost" sz="sm" onClick={onLogout}>Sign Out</Btn>
          </Surf>
        </div>
      )}

      {/* ── COLLECTION ── */}
      {view==="collection"&&<div style={{paddingBottom:80}}>
        {folders.length>0&&<div style={{padding:"12px 16px 0",display:"flex",gap:6,overflowX:"auto"}}>
          <button onClick={()=>setAF(null)} style={{padding:"5px 12px",borderRadius:20,border:`1.5px solid ${aF===null?t.acc:t.bord}`,background:aF===null?t.accBg:"transparent",color:aF===null?t.acc:t.tx3,fontSize:12,cursor:"pointer",fontWeight:600,whiteSpace:"nowrap"}}>All</button>
          {folders.map(f=>(
            <button key={f.name} onClick={()=>setAF(f.name===aF?null:f.name)} style={{padding:"5px 12px",borderRadius:20,border:`1.5px solid ${aF===f.name?t.acc:t.bord}`,background:aF===f.name?t.accBg:"transparent",color:aF===f.name?t.acc:t.tx3,fontSize:12,cursor:"pointer",fontWeight:600,whiteSpace:"nowrap",display:"flex",alignItems:"center",gap:5}}>
              {f.cover&&<img src={f.cover} alt="" style={{width:14,height:14,borderRadius:2,objectFit:"cover"}}/>}{f.name} ({cards.filter(c=>c.folder===f.name).length})
            </button>
          ))}
        </div>}
        <div style={{padding:"10px 16px",display:"flex",flexWrap:"wrap",gap:8}}>
          <input placeholder="Search cards…" value={search} onChange={e=>setSearch(e.target.value)}
            style={{flex:"1 1 160px",padding:"9px 14px",borderRadius:10,border:`1.5px solid ${t.bord}`,background:t.inp,color:t.tx,fontSize:13,outline:"none",fontFamily:"inherit"}}
            onFocus={e=>e.target.style.borderColor=t.acc} onBlur={e=>e.target.style.borderColor=t.bord}/>
          {[["sport",SPORTS,filters.sport,"All Sports"],["type",CTYPES,filters.type,"All Types"],["par",["All Parallels",...PARS],filters.par,"All Parallels"],["cond",CONDS,filters.cond,"All Conditions"],["brand",BRANDS,filters.brand,"All Brands"]].map(([k,opts,val,def])=>(
            <select key={k} value={val} onChange={e=>setFilters(f=>({...f,[k]:e.target.value}))}
              style={{padding:"9px 12px",borderRadius:10,border:`1.5px solid ${t.bord}`,background:t.inp,color:val===def?t.tx3:t.tx,fontSize:12,cursor:"pointer",outline:"none",appearance:"none",fontFamily:"inherit"}}>
              {opts.map(o=><option key={o} value={o}>{o}</option>)}
            </select>
          ))}
          <select value={sort} onChange={e=>setSort(e.target.value)} style={{padding:"9px 12px",borderRadius:10,border:`1.5px solid ${t.bord}`,background:t.inp,color:t.tx2,fontSize:12,cursor:"pointer",outline:"none",appearance:"none",fontFamily:"inherit"}}>
            <option value="newest">Newest</option><option value="value_hi">Value ↓</option><option value="value_lo">Value ↑</option><option value="alpha">A–Z</option><option value="year_new">Year ↓</option>
          </select>
        </div>
        <div style={{padding:"0 16px 10px",display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <div style={{color:t.tx3,fontSize:12,fontWeight:600}}>{filtered.length} card{filtered.length!==1?"s":""}</div>
          <div style={{display:"flex",gap:7}}>
            {selMode&&selIds.size>0&&<>
              <select onChange={e=>{if(e.target.value){mvSel(e.target.value==="__none__"?null:e.target.value);}e.target.value="";}} style={{padding:"6px 10px",borderRadius:8,border:`1px solid ${t.bord}`,background:t.inp,color:t.tx,fontSize:12,outline:"none",appearance:"none"}}>
                <option value="">Move to…</option><option value="__none__">No folder</option>
                {folders.map(f=><option key={f.name} value={f.name}>{f.name}</option>)}
              </select>
              <Btn t={t} v="red" sz="sm" onClick={dlSel}>Delete ({selIds.size})</Btn>
            </>}
            <Btn t={t} v={selMode?"soft":"ghost"} sz="sm" onClick={()=>{setSelMode(s=>!s);setSelIds(new Set());}}>{selMode?"Done":"Select"}</Btn>
            <button onClick={()=>setListMode(m=>!m)} style={{background:t.surf2,border:`1px solid ${t.bord}`,color:t.tx2,borderRadius:8,padding:"6px 10px",cursor:"pointer",fontSize:14}}>{listMode?"⊞":"☰"}</button>
          </div>
        </div>
        {!listMode&&<div style={{padding:"0 16px",display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(115px,1fr))",gap:10}}>
          {filtered.map(c=><CardTile key={c.id} card={c} onClick={x=>!selMode&&setSel(x)} selMode={selMode} selSet={setSelIds} selIds={selIds} t={t}/>)}
          <div onClick={()=>setScanning(true)} style={{aspectRatio:"2.5/3.5",borderRadius:12,border:`2px dashed ${t.bord}`,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",cursor:"pointer",transition:"border-color .15s"}}
            onMouseEnter={e=>e.currentTarget.style.borderColor=t.acc} onMouseLeave={e=>e.currentTarget.style.borderColor=t.bord}>
            <div style={{fontSize:22,color:t.tx3}}>+</div><div style={{color:t.tx3,fontSize:11,fontWeight:600,marginTop:3}}>Add</div>
          </div>
        </div>}
        {listMode&&<div style={{padding:"0 16px",display:"flex",flexDirection:"column",gap:6}}>
          {filtered.map(c=>{const isP=c.parallel&&c.parallel!=="Base";return(
            <Surf key={c.id} t={t} p={10} r={12} style={{display:"flex",alignItems:"center",gap:10,cursor:"pointer",border:isP?`1px solid ${t.gold}30`:`1px solid ${t.bord}`}} onClick={()=>setSel(c)}>
              <div style={{width:38,height:53,borderRadius:8,overflow:"hidden",flexShrink:0}}>{c.image?<img src={c.image} alt={c.player} style={{width:"100%",height:"100%",objectFit:"cover"}}/>:<CardArt card={c} sm/>}</div>
              <div style={{flex:1,minWidth:0}}>
                <div style={{fontSize:14,fontWeight:800,color:t.tx,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{c.player}</div>
                <div style={{color:t.tx3,fontSize:11,marginTop:1}}>{c.year} {c.brand}{isP?` · ${c.parallel}`:""}</div>
              </div>
              <div style={{textAlign:"right",flexShrink:0}}>
                {c.ebayAvg?<div style={{fontSize:14,fontWeight:800,color:t.gold}}>{fmt(c.ebayAvg)}</div>:<div style={{color:t.tx3,fontSize:12}}>—</div>}
                {c.graded&&<div style={{color:t.grn,fontSize:11,fontWeight:700}}>{c.grade}</div>}
              </div>
            </Surf>
          );})}
        </div>}
      </div>}

      {/* ── STATS ── */}
      {view==="stats"&&<div style={{padding:"16px 16px 80px"}}>
        <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:8,marginBottom:14}}>
          {[["Cards",cards.length,"#007AFF"],["Value",fmt(tv(cards)),"#FF9F0A"],["Rookies",cards.filter(c=>c.type==="Rookie").length,"#34C759"],["Graded",cards.filter(c=>c.graded).length,"#8E8E93"],["Serialed",cards.filter(c=>c.serialed).length,"#AF52DE"],["Parallels",cards.filter(c=>c.parallel&&c.parallel!=="Base").length,"#FF9F0A"]].map(([l,v,clr])=>(
            <Surf key={l} t={t} p={12} r={12} style={{textAlign:"center"}}>
              <div style={{fontSize:20,fontWeight:900,color:clr}}>{v}</div>
              <div style={{color:t.tx3,fontSize:10,fontWeight:700,marginTop:2}}>{l.toUpperCase()}</div>
            </Surf>
          ))}
        </div>
        {[...cards].sort((a,b)=>(b.ebayAvg||0)-(a.ebayAvg||0)).slice(0,5).length>0&&(
          <Surf t={t} p={14} r={14} style={{marginBottom:12}}>
            <div style={{fontSize:12,fontWeight:800,color:t.tx3,letterSpacing:.5,marginBottom:12}}>TOP 5 BY VALUE</div>
            {[...cards].sort((a,b)=>(b.ebayAvg||0)-(a.ebayAvg||0)).slice(0,5).map((c,i)=>(
              <div key={c.id} onClick={()=>setSel(c)} style={{display:"flex",alignItems:"center",gap:10,padding:"8px 0",borderTop:i>0?`1px solid ${t.bord}`:"none",cursor:"pointer"}}>
                <div style={{width:22,textAlign:"center",fontSize:14,fontWeight:800,color:i===0?t.gold:t.tx3}}>{i+1}</div>
                <div style={{width:32,height:44,borderRadius:6,overflow:"hidden",flexShrink:0}}>{c.image?<img src={c.image} alt={c.player} style={{width:"100%",height:"100%",objectFit:"cover"}}/>:<CardArt card={c} sm/>}</div>
                <div style={{flex:1,minWidth:0}}>
                  <div style={{fontSize:13,fontWeight:800,color:t.tx,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{c.player}</div>
                  <div style={{color:t.tx3,fontSize:11}}>{c.year} {c.brand}{c.parallel&&c.parallel!=="Base"?` · ${c.parallel}`:""}</div>
                </div>
                <div style={{fontSize:14,fontWeight:800,color:t.gold}}>{fmt(c.ebayAvg||0)}</div>
              </div>
            ))}
          </Surf>
        )}
        {cards.length===0&&<div style={{textAlign:"center",padding:"60px 0"}}><Logo size={40} color={t.tx3}/><div style={{fontSize:16,fontWeight:700,color:t.tx,marginTop:12,marginBottom:4}}>No cards yet</div><div style={{color:t.tx3,fontSize:13}}>Scan a card to see stats</div></div>}
      </div>}

      {/* ── LEADERBOARD — real users only ── */}
      {view==="leaderboard"&&<div style={{padding:"16px 16px 80px"}}>
        {board.length===0&&(
          <div style={{textAlign:"center",padding:"60px 20px"}}>
            <div style={{fontSize:52,marginBottom:12}}>🏆</div>
            <div style={{fontSize:18,fontWeight:800,color:t.tx,marginBottom:8}}>No rankings yet</div>
            <div style={{color:t.tx2,fontSize:14,lineHeight:1.6,maxWidth:300,margin:"0 auto"}}>Only real registered users appear here. Enable <strong>"Show on Leaderboard"</strong> in Settings → Privacy, then add cards with estimated values.</div>
          </div>
        )}
        {board.length>=2&&(
          <div style={{display:"flex",alignItems:"flex-end",justifyContent:"center",gap:8,marginBottom:24}}>
            {(board.length===2?[board[1],board[0]]:[board[1],board[0],board[2]]).map((u,idx)=>{
              const rank=board.length===2?(idx===1?0:1):(idx===1?0:idx===0?1:2);
              const hs=board.length===2?[100,128]:[100,128,82];
              const isMe=u.id===user.id;
              const bgClrs=[t.gold,"#A0A0A8","#CD7F32"];
              return(
                <div key={u.id} style={{flex:1,display:"flex",flexDirection:"column",alignItems:"center",gap:7,maxWidth:120}}>
                  <Av name={u.name} size={rank===0?46:36} t={t}/>
                  <div style={{fontSize:12,fontWeight:700,color:isMe?t.acc:t.tx,textAlign:"center",width:"100%",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{isMe?"You":u.name}</div>
                  <div style={{width:"100%",height:hs[idx],background:bgClrs[rank],borderRadius:"10px 10px 0 0",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:4}}>
                    <div style={{fontSize:rank===0?26:20}}>{medals[rank]}</div>
                    <div style={{color:"#fff",fontSize:12,fontWeight:800}}>{fmt(u.total)}</div>
                    <div style={{color:"rgba(255,255,255,.7)",fontSize:10,fontWeight:600}}>{(u.cards||[]).length} cards</div>
                  </div>
                </div>
              );
            })}
          </div>
        )}
        {board.length===1&&(
          <div style={{display:"flex",justifyContent:"center",marginBottom:20}}>
            <div style={{display:"flex",flexDirection:"column",alignItems:"center",gap:8}}>
              <Av name={board[0].name} size={52} t={t}/>
              <div style={{fontSize:14,fontWeight:700,color:board[0].id===user.id?t.acc:t.tx}}>{board[0].id===user.id?"You":board[0].name}</div>
              <div style={{background:t.gold,borderRadius:12,padding:"12px 24px",textAlign:"center"}}>
                <div style={{fontSize:28}}>🥇</div>
                <div style={{color:"#fff",fontSize:16,fontWeight:800,marginTop:2}}>{fmt(board[0].total)}</div>
              </div>
            </div>
          </div>
        )}
        <div style={{display:"flex",flexDirection:"column",gap:8}}>
          {board.map((u,i)=>{
            const isMe=u.id===user.id;
            const pct=Math.max(4,Math.round((u.total/boardMax)*100));
            return(
              <Surf key={u.id} t={t} p={14} r={12} style={{border:isMe?`2px solid ${t.acc}`:`1px solid ${t.bord}`,background:isMe?t.accBg:t.surf}}>
                <div style={{display:"flex",alignItems:"center",gap:12}}>
                  <div style={{width:32,textAlign:"center",fontWeight:800,fontSize:i<3?18:14,color:i===0?t.gold:i===1?"#A0A0A8":i===2?"#CD7F32":t.tx3,flexShrink:0}}>{i<3?medals[i]:`#${i+1}`}</div>
                  <Av name={u.name} size={38} t={t}/>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{fontSize:14,fontWeight:800,color:isMe?t.acc:t.tx,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",marginBottom:5}}>{isMe?`You (${u.name})`:u.name}</div>
                    <div style={{display:"flex",alignItems:"center",gap:8}}>
                      <div style={{flex:1,height:5,background:t.surf2,borderRadius:3,overflow:"hidden"}}><div style={{height:"100%",width:`${pct}%`,background:i===0?t.gold:isMe?t.acc:t.tx3,borderRadius:3}}/></div>
                      <span style={{color:t.tx3,fontSize:11,fontWeight:600,whiteSpace:"nowrap"}}>{(u.cards||[]).length} cards</span>
                    </div>
                  </div>
                  <div style={{textAlign:"right",flexShrink:0}}>
                    <div style={{fontSize:17,fontWeight:900,color:i===0?t.gold:isMe?t.acc:t.tx}}>{fmt(u.total)}</div>
                    <div style={{color:t.tx3,fontSize:11,marginTop:1}}>est. value</div>
                  </div>
                </div>
              </Surf>
            );
          })}
        </div>
        {board.length>0&&<Surf t={t} p={14} r={12} style={{marginTop:12,background:t.surf2}}>
          <div style={{color:t.tx3,fontSize:12,lineHeight:1.6,textAlign:"center"}}>Only real registered users are shown. Go to <strong style={{color:t.tx}}>Settings → Privacy</strong> to control your visibility.
          </div>
        </Surf>}
      </div>}

      {/* ── SETTINGS overlay ── */}
      {view==="settings"&&(
        <div style={{position:"fixed",inset:0,zIndex:400,background:t.bg,overflowY:"auto"}}>
          <SettingsPage
            user={{...user,settings}}
            onUpdate={u=>{
              const newSettings={...DS,...u.settings};
              setSettings(newSettings);
              // Apply dark mode immediately
              setTheme(newSettings.darkMode?DK:LT);
              onUpdUser({...u,settings:newSettings});
            }}
            onBack={()=>setView("home")}
            t={t}
          />
        </div>
      )}

      {/* ── HELP overlay ── */}
      {view==="help"&&(
        <div style={{position:"fixed",inset:0,zIndex:400,background:t.bg,overflowY:"auto"}}>
          <HelpPage onBack={()=>setView("home")} onTour={()=>{setView("home");setShowTour(true);}} onQuestion={onQuestion} user={user} t={t}/>
        </div>
      )}

      {/* ── MODALS ── */}
      {scanning&&<ScanModal onClose={()=>setScanning(false)} onAdd={addCard} folders={folders} t={t}/>}
      {sel&&<Detail card={sel} onClose={()=>setSel(null)} onUpdate={updCard} onDelete={delCard} folders={folders} t={t}/>}
      {showF&&<FolderModal folders={folders} cards={cards} onClose={()=>setShowF(false)} onCreate={mkF} onDelete={rmF} onRename={rnF} onCover={cvF} t={t}/>}
      {showWl&&<WishlistModal wl={wl} onClose={()=>setShowWl(false)} onAdd={w=>setWl(l=>[w,...l])} onDel={id=>setWl(l=>l.filter(w=>w.id!==id))} t={t}/>}
      {showTour&&<TourModal t={t} onDone={()=>setShowTour(false)}/>}
    </div>
  );
}

/* ─── ROOT ───────────────────────────────────────────────────────────────── */
function App(){
  const[users,setUsers]=useState(SEED_USERS);
  const[me,setMe]=useState(null);
  const[showAdmin,setShowAdmin]=useState(false);
  const[notifs,setNotifs]=useState([]);
  const[theme,setTheme]=useState(LT);
  const[tour,setTour]=useState(false);

  const updUser=u=>{setUsers(p=>p.map(x=>x.id===u.id?u:x));if(me?.id===u.id)setMe(u);};
  const login=u=>{setMe(u);setShowAdmin(false);setTheme(u.settings?.darkMode?DK:LT);};
  const logout=()=>{setMe(null);setShowAdmin(false);setTheme(LT);};
  const register=async u=>{
    setUsers(p=>[...p,u]);setMe(u);setTheme(LT);setTour(true);
    // Request camera permission
    try{ await navigator.mediaDevices.getUserMedia({video:true,audio:false}).then(s=>s.getTracks().forEach(t=>t.stop())); }catch(e){}
    // Request notification permission
    if("Notification" in window && Notification.permission==="default"){
      try{ await Notification.requestPermission(); }catch(e){}
    }
  };
  const handleForgot=u=>{const pw=gpw();setNotifs(n=>[{id:uid(),type:"pw",userEmail:u.email,userName:u.name,recovery:u.recovery||u.email,recoveryType:u.recoveryType||"email",tempPass:pw,time:nows(),read:false,sent:false},...n]);};
  const handleQuestion=(q,userName,userEmail)=>{setNotifs(n=>[{id:uid(),type:"question",userName,userEmail,question:q,time:nows(),read:false,answered:false,answer:""},...n]);};
  const sendRec=id=>setNotifs(n=>n.map(x=>x.id===id?{...x,sent:true,read:true}:x));
  const answerQ=(id,ans)=>setNotifs(n=>n.map(x=>x.id===id?{...x,answered:true,read:true,answer:ans}:x));
  const dismiss=id=>setNotifs(n=>n.filter(x=>x.id!==id));

  const t=theme;

  return(
    <>
      <style>{`
        @keyframes shim{0%{background-position:200% 0}100%{background-position:-200% 0}}
        @keyframes pulse{0%,100%{opacity:.2;transform:scale(.8)}50%{opacity:1;transform:scale(1)}}
        *{box-sizing:border-box;margin:0;padding:0}
        html,body{background:${t.bg};color-scheme:${t.dark?"dark":"light"}}
        ::-webkit-scrollbar{width:4px}
        ::-webkit-scrollbar-thumb{background:${t.bord};border-radius:2px}
        select,input,textarea{color-scheme:${t.dark?"dark":"light"};font-family:inherit}
      `}</style>

      {tour&&me&&<TourModal t={t} onDone={()=>setTour(false)}/>}

      {!me&&<Auth users={users} onLogin={login} onReg={register} onForgot={handleForgot} t={t}/>}

      {me&&showAdmin&&me.role==="admin"&&
        <AdminPanel users={users} notifs={notifs} onBack={()=>setShowAdmin(false)} onSend={sendRec} onDismiss={dismiss} onAnswer={answerQ} t={t}/>}

      {me&&!showAdmin&&
        <Vault user={me} allUsers={users} onUpdUser={updUser} onLogout={logout} onGoAdmin={()=>setShowAdmin(true)} notifs={notifs} theme={theme} setTheme={setTheme} onQuestion={handleQuestion}/>}
    </>
  );
}
</script>

  <!-- Bootstrap: runs AFTER all above elements exist in DOM -->
  <script>
  (function() {
    function showErr(msg, stack) {
      var d = document.getElementById('errdiv');
      d.style.display = 'block';
      d.textContent = msg + (stack ? '\n\n' + stack : '');
      document.getElementById('loader').style.display = 'none';
    }

    try {
      document.getElementById('lstatus').textContent = 'Compiling app...';

      // Expose React hooks as globals so the JSX source can use them directly
      var useState    = React.useState;
      var useRef      = React.useRef;
      var useEffect   = React.useEffect;
      var useCallback = React.useCallback;
      var useMemo     = React.useMemo;

      // Read JSX source from the text/plain tag
      var srcEl = document.getElementById('appsrc');
      if (!srcEl) { showErr('Source element not found'); return; }
      var jsxCode = srcEl.textContent;

      // Compile JSX → JS using Babel
      var result = Babel.transform(jsxCode, {
        presets: [['react', { runtime: 'classic', pragma: 'React.createElement', pragmaFrag: 'React.Fragment' }]],
        plugins: [],
        filename: 'app.jsx'
      });

      document.getElementById('lstatus').textContent = 'Starting app...';

      // Execute compiled code, capture the App function
      // We inject the hook variables into scope via a wrapper function
      var execFn = new Function(
        'useState','useRef','useEffect','useCallback','useMemo',
        result.code + '\nreturn App;'
      );
      var AppComponent = execFn(useState, useRef, useEffect, useCallback, useMemo);

      // Mount React
      var rootEl = document.getElementById('root');
      var reactRoot = ReactDOM.createRoot(rootEl);
      reactRoot.render(React.createElement(AppComponent));

      // Hide loader
      document.getElementById('loader').style.display = 'none';

    } catch(e) {
      showErr('Error: ' + e.message, e.stack);
    }
  })();
  </script>

</body>
</html>
